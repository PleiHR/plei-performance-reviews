function viewReminders(cycle){
  const daysLeft = Math.ceil((new Date(cycle.endDate+'T23:59:59') - new Date()) / 86400000);
  const pendingSelf = DB.people.filter(p=>{ const r=findReview('self',cycle.id,x=>x.employeeId===p.id); return !(r&&r.status==='submitted'); });
  const pendingMgr = DB.people.filter(p=>p.managerId).filter(p=>{ const r=findReview('manager',cycle.id,x=>x.employeeId===p.id); return !(r&&r.status==='submitted'); });
  const pendingUpward = DB.people.filter(p=>p.managerId).filter(p=>!DB.upwardAuthorship.find(r=>r.cycleId===cycle.id && r.managerId===p.managerId));
  const rows = DB.people.filter(p=>{
    const selfPending = pendingSelf.includes(p);
    const mgrPending = p.managerId && pendingMgr.includes(p);
    const upwardPending = p.managerId && pendingUpward.includes(p);
    return selfPending || mgrPending || upwardPending;
  });
  return `<div class="card">
    <h2>Reminders</h2>
    <div class="desc">${cycle.label} — ${daysLeft>=0?`${daysLeft} day${daysLeft===1?'':'s'} left`:'Cycle ended'}. Company wide feedback is optional, so it's not tracked here as a pending item.</div>
    <div class="grid grid-2">
      <div class="stat"><div class="num">${pendingSelf.length}</div><div class="lbl">Self-reviews pending</div></div>
      <div class="stat"><div class="num">${pendingMgr.length}</div><div class="lbl">Manager reviews pending</div></div>
      <div class="stat"><div class="num">${pendingUpward.length}</div><div class="lbl">Upward reviews not submitted</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Add cycle deadline to calendar</h2>
    <div class="desc">Download a calendar invite for the review deadline (${fmtDate(cycle.endDate)}) to share with the team or add yourself.</div>
    <button class="btn secondary" id="downloadCycleIcs">📅 Download .ics</button>
  </div>
  <div class="card">
    <h2>People with pending items</h2>
    ${rows.length===0?'<div class="empty">Everyone is caught up.</div>':`
    <table><thead><tr><th>Person</th><th>Self-review</th><th>Manager review</th><th>Upward review</th></tr></thead><tbody>
    ${rows.map(p=>{
      const selfPending = pendingSelf.includes(p);
      const mgrPending = p.managerId && pendingMgr.includes(p);
      const upwardPending = p.managerId && pendingUpward.includes(p);
      return `<tr>
        <td>${p.name}</td>
        <td>${selfPending?'<span class="badge bad">Pending</span>':'<span class="badge ok">Done</span>'}</td>
        <td>${p.managerId?(mgrPending?'<span class="badge bad">Pending</span>':'<span class="badge ok">Done</span>'):'—'}</td>
        <td>${p.managerId?(upwardPending?'<span class="badge bad">Pending</span>':'<span class="badge ok">Done</span>'):'—'}</td>
      </tr>`;
    }).join('')}
    </tbody></table>`}
  </div>
  <div class="card">
    <h2>Automated nudges (email)</h2>
    <div class="desc">Daily email reminders for pending reviews, escalating to the skip-level manager in the final week, run outside this app via a scheduled Google Apps Script on the Plei Google Workspace.</div>
  </div>`;
}

function viewMyReviews(cycle, person){
  const cyclesDesc = DB.cycles.slice().reverse();

  // My score + trend: the two most recent cycles that have a submitted manager review.
  let latestScored = null, priorScored = null;
  for(const c of cyclesDesc){
    const mgrRev = findReview('manager', c.id, x=>x.employeeId===person.id && x.status==='submitted');
    const score = mgrRev ? ratingAvgOfReview(mgrRev) : null;
    if(score===null || score===undefined) continue;
    if(!latestScored){ latestScored = {cycle:c, score}; }
    else { priorScored = {cycle:c, score}; break; }
  }
  const trend = (latestScored && priorScored) ? (latestScored.score - priorScored.score) : null;

  // Coffee chats this year: pairings involving this person where a calendar invite exists.
  const thisYear = String(new Date().getFullYear());
  const coffeeThisYear = (DB.coffeeChats||[]).filter(c=>(c.personA===person.id || c.personB===person.id) && c.calendarEventId && (c.month||'').slice(0,4)===thisYear).length;

  // On-time percentage: of this person's own submitted self-reviews and upward reviews, how
  // many landed on or before that cycle's deadline. Cycles with nothing submitted yet are
  // excluded rather than counted as late, since "not due yet" and "missed" aren't the same thing.
  const onTimeChecks = [];
  DB.reviews.self.filter(r=>r.employeeId===person.id && r.status==='submitted' && r.submittedAt).forEach(r=>{
    const c = getCycle(r.cycleId); if(c && c.endDate) onTimeChecks.push(r.submittedAt.slice(0,10) <= c.endDate);
  });
  (DB.upwardAuthorship||[]).filter(r=>r.authorEmail===person.email && (r.createdAt||r.updatedAt)).forEach(r=>{
    const c = getCycle(r.cycleId); if(c && c.endDate) onTimeChecks.push((r.createdAt||r.updatedAt).slice(0,10) <= c.endDate);
  });
  const onTimePct = onTimeChecks.length ? Math.round(onTimeChecks.filter(Boolean).length / onTimeChecks.length * 100) : null;

  const myPeerReviews = DB.peerAuthorship.filter(r=>r.authorEmail===person.email).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const myPeerSummary = peerSummaryFor(person.id, cycle.id);

  // Only cycles with a submitted self-review and/or manager review show up here.
  const reviewCycles = cyclesDesc.filter(c=>{
    const sr = findReview('self', c.id, x=>x.employeeId===person.id);
    const mr = findReview('manager', c.id, x=>x.employeeId===person.id);
    return (sr && sr.status==='submitted') || (mr && mr.status==='submitted');
  });

  return `<div class="card">
    <div class="row" style="justify-content:space-between;">
      <div>
        <h2 style="margin:0;">My profile</h2>
        <div class="desc" style="margin:2px 0 0 0;">${person.name} · ${person.title} · ${person.department}</div>
      </div>
      <button class="btn ghost sm" id="signOutBtnProfile">Sign out</button>
    </div>
  </div>
  <div class="grid grid-4">
    <div class="stat"><div class="num">${latestScored?scoreBadge(latestScored.score):'<span class="score na">—</span>'}</div><div class="lbl">My score${latestScored?' · '+escapeHtml(latestScored.cycle.label):''}</div></div>
    <div class="stat"><div class="num">${trend===null?'—':(trend>=0?'▲ +':'▼ −')+Math.abs(trend).toFixed(1)}</div><div class="lbl">Trend vs last cycle</div></div>
    <div class="stat"><div class="num">${coffeeThisYear}</div><div class="lbl">Coffee chats this year</div></div>
    <div class="stat"><div class="num">${onTimePct===null?'—':onTimePct+'%'}</div><div class="lbl">On-time percentage</div></div>
  </div>
  <div class="card">
    <h3 class="section-h">My reviews</h3>
    ${reviewCycles.length===0?'<div class="empty">No reviews on file yet.</div>':`
    <table><thead><tr><th>Cycle</th><th>Self-review</th><th>Manager's review</th><th>Combined</th><th>Rating</th></tr></thead><tbody>
    ${reviewCycles.map(c=>{
      const sr = findReview('self', c.id, x=>x.employeeId===person.id);
      const mr = findReview('manager', c.id, x=>x.employeeId===person.id);
      const srOk = !!(sr && sr.status==='submitted');
      const mrOk = !!(mr && mr.status==='submitted');
      const key = person.id+'|'+c.id;
      const score = mrOk ? ratingAvgOfReview(mr) : null;
      return `<tr>
        <td>${escapeHtml(c.label)}</td>
        <td>${srOk?`<button class="actbtn" data-print-self-cycle="${key}">View</button>`:'<span class="stpill neutral">Not filed</span>'}</td>
        <td>${mrOk?`<button class="actbtn" data-print-mgr-cycle="${key}">View</button>`:'<span class="stpill neutral">Not filed</span>'}</td>
        <td>${(srOk&&mrOk)?`<button class="actbtn" data-print-combined-cycle="${key}">View</button>`:'<span class="stpill neutral">Not filed</span>'}</td>
        <td>${scoreBadge(score)}</td>
      </tr>`;
    }).join('')}
    </tbody></table>`}
  </div>
  <div class="card">

const PDF_HEADER_CSS = ".pdf-header{display:flex;align-items:center;gap:14px;border-bottom:2px solid #E6FAF5;padding-bottom:16px;margin-bottom:24px;} .pdf-header img{height:28px;width:auto;} .pdf-header-meta{display:flex;flex-direction:column;font-size:11.5px;color:#5c7c74;} .pdf-header-meta b{font-family:'Clash Grotesk','Inter',sans-serif;font-size:13px;color:#0B3B2E;}";
function pdfHeader(cycleLabel){
  return `<div class="pdf-header"><img src="data:image/png;base64,${PDF_LOGO_B64}" alt="Plei"><div class="pdf-header-meta"><b>Plei Performance</b><span>${cycleLabel} · Generated ${new Date().toLocaleDateString('en-US')}</span></div></div>`;
}

function buildCombinedPrintable(cycle, employee){
  const selfRev = findReview('self',cycle.id,x=>x.employeeId===employee.id);
  const mgrRev = findReview('manager',cycle.id,x=>x.employeeId===employee.id);
  const mgr = employee.managerId ? getPerson(employee.managerId) : null;
  const ratingsHtml = mgrRev ? MANAGER_RATINGS.map(f=>`<tr><td>${f.label}</td><td><b>${mgrRev.ratings[f.key]}</b>/5 — ${RATING_LABELS[mgrRev.ratings[f.key]]}</td></tr>`).join('') : '';
  return `
  <html><head><meta charset="UTF-8"><title>Review — ${employee.name}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@600&display=swap">
  <style>
    body{font-family:'Inter',-apple-system,Arial,sans-serif;color:#0B3B2E;padding:40px;max-width:800px;margin:0 auto;}
    ${PDF_HEADER_CSS}
    h1{font-family:'Clash Grotesk','Inter',sans-serif;font-size:22px;margin-bottom:2px;} h2{font-family:'Clash Grotesk','Inter',sans-serif;font-size:16px;margin-top:32px;border-bottom:2px solid #16755C;padding-bottom:6px;}
    .meta{color:#5c7c74;font-size:13px;margin-bottom:20px;}
    table{width:100%;border-collapse:collapse;margin:10px 0;} td{padding:6px 4px;border-bottom:1px solid #eee;font-size:13.5px;}
    .block{margin-bottom:16px;} .block b{display:block;font-size:13px;margin-bottom:3px;color:#16755C;} .block p{margin:0;font-size:13.5px;line-height:1.5;}
  </style></head><body>
  ${pdfHeader(cycle.label)}
  <h1>Performance Review — ${employee.name}</h1>
  <div class="meta">${employee.title} · ${employee.department} · Manager: ${mgr?mgr.name:'—'} · ${cycle.label}</div>

  ${mgrRev ? `<h2>Manager evaluation</h2>
  <table>${ratingsHtml}</table>
  ${MANAGER_FIELDS.map(f=>`<div class="block"><b>${f.label}</b><p>${escapeHtml(mgrRev.answers[f.key])||'—'}</p></div>`).join('')}` : ''}

  ${selfRev ? `<h2>Self-review</h2>
  ${SELF_FIELDS.map(f=>`<div class="block"><b>${f.label}</b><p>${escapeHtml(selfRev.answers[f.key])||'—'}</p></div>`).join('')}` : ''}

  <div class="meta" style="margin-top:30px;">Generated by Plei Performance on ${new Date().toLocaleDateString('en-US')}</div>
  </body></html>`;
}

function printHtml(html){
  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(()=>w.print(), 300);
}
function buildICS(opts){
  const title = opts.title, description = opts.description || '', date = opts.date;
  const dt = date.replace(/-/g,'');
  const now = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const desc = description.replace(/\n/g,'\\n');
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Plei//Performance//EN','BEGIN:VEVENT',
    'UID:'+uid('ics')+'@plei.com','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+dt,
    'SUMMARY:'+title,'DESCRIPTION:'+desc,'END:VEVENT','END:VCALENDAR'
  ];
  return lines.join('\r\n');
}
function downloadICS(filename, icsText){
  const blob = new Blob([icsText], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function bindManagerFormEvents(cycle, manager, employee){
  const host = document.getElementById('managerFormHost');
  const existing = findReview('manager', cycle.id, x=>x.employeeId===employee.id) || {ratings:{}, answers:{}};
  const dKey = draftKey('manager', cycle.id, employee.id);
  const draft = loadLocalDraft(dKey) || {};
  const ratings = Object.assign({}, existing.ratings, draft.ratings||{});
  function collectAnswers(){
    const answers = {};
    MANAGER_FIELDS.forEach(f=>{ answers[f.key] = host.querySelector(`[data-mgr-field="${f.key}"]`).value; });
    return answers;
  }
  const persistDraft = ()=>{ saveLocalDraft(dKey, {ratings, answers: collectAnswers()}); };
  MANAGER_RATINGS.forEach(f=>bindRatingRow(host, f, val=>{ ratings[f.key]=val; persistDraft(); }));
  MANAGER_FIELDS.forEach(f=>{
    const el = host.querySelector(`[data-mgr-field="${f.key}"]`);
    if(el) el.addEventListener('input', persistDraft);
  });
  host.querySelector('[data-close-manager-form]')?.addEventListener('click', ()=>{ host.innerHTML=''; });

  async function upsert(status){
    const rev = findReview('manager', cycle.id, x=>x.employeeId===employee.id);
    const id = rev ? rev.id : uid('mr');
    await fdb.collection('reviews_manager').doc(id).set({
      cycleId:cycle.id, managerId:manager.id, managerEmail:manager.email,
      employeeId:employee.id, employeeEmail:employee.email,
      ratings, answers:collectAnswers(), status, submittedAt:new Date().toISOString()
    }, {merge:true});
  }
  host.querySelector('#submitManagerReview')?.addEventListener('click', async ()=>{
    const missing = MANAGER_RATINGS.filter(f=>!ratings[f.key]);
    if(missing.length){ alert('Please complete all ratings before submitting.'); return; }
    await upsert('submitted');
    clearLocalDraft(dKey);
    await ensureOneOnOneTask(cycle, manager, employee);
    try{
      await sendGmail({
        to: employee.email,
        subject: 'Your ' + cycle.label + ' review is ready',
        bodyHtml: '<p>Hi ' + employee.name + ',</p>' +
          '<p><b>' + manager.name + '</b> has submitted your manager review for <b>' + cycle.label + '</b> in Plei Performance.</p>' +
          '<p>Your manager will reach out to schedule a short 1:1 to walk through it together — this is a required step every cycle.</p>' +
          '<p>You can check your review and the 1:1 status any time under My Profile in Plei Performance.</p>' +
          '<p>— Plei Performance</p>'
      });
    }catch(e){ console.error('sendGmail (review submitted) failed:', e); }
    toast('Review submitted — don\'t forget to schedule the 1:1 debrief'); render();
  });
  host.querySelector('#saveDraftManagerReview')?.addEventListener('click', async ()=>{ await upsert('draft'); clearLocalDraft(dKey); toast('Draft saved'); });
}

        });
        clearLocalDraft(dKey);
        toast('Review submitted anonymously to HR'); render();
      }
    } catch(e){ console.error(e); alert('Could not submit — please try again.'); submitBtn.disabled = false; }
  });
}
function bindSuggestFormEvents(person){
  const submitBtn = document.getElementById('submitSuggestion');
  if(!submitBtn) return;
  const dKey = draftKey('suggest', 'all', person.id);
  const textEl = document.getElementById('sg_text');
  const catEl = document.getElementById('sg_cat');
  const anonEl = document.getElementById('sg_anon');
  const persistDraft = ()=>{ saveLocalDraft(dKey, {text: textEl.value, category: catEl.value, anon: anonEl.checked}); };
  textEl?.addEventListener('input', persistDraft);
  catEl?.addEventListener('change', persistDraft);
  anonEl?.addEventListener('change', persistDraft);
  submitBtn.addEventListener('click', async ()=>{
    const text = textEl.value.trim();
    if(!text){ alert('Please write your suggestion.'); return; }
    const anon = anonEl.checked;
    await fdb.collection('suggestions').doc(uid('sg')).set({cycleId:STATE.activeCycleId, anonymous:anon, authorName:anon?'':person.name,
      category:catEl.value, text, createdAt:new Date().toISOString().slice(0,10)});
    clearLocalDraft(dKey);
    toast('Suggestion submitted'); render();
  });
}

initApp();
</script>
</body>
</html>
