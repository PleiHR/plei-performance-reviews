<style>
  :root{
    /* Plei Brand Guide v1.0 (updated May 2026) */
    --cyprus:#0B3B2E; --pitch:#16755C; --emerald:#4ADE80; --mint:#E6FAF5;
    --pebble:#f1f1f1; --midnight:#171d1a; --claret:#511124; --sangria:#FF6333;

    --bg:var(--pebble); --panel:#ffffff; --ink:var(--cyprus); --sub:#5c7c74; --line:#e1e5e2;
    --brand:var(--pitch); --brand-ink:#ffffff; --brand-light:var(--mint);
    --ok:var(--pitch); --ok-bg:var(--mint); --warn:#8a5a12; --warn-bg:#fbeedd; --bad:var(--claret); --bad-bg:#f6e6ea;
    --r:12px;
    --font-head:'Clash Grotesk','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);}
  h1,h2,h3,.card h2,.brand,.topbar-title,.login-card h1,.stat .num{font-family:var(--font-head);font-weight:600;}
  a{color:inherit;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:250px;background:var(--cyprus);color:#fff;flex-shrink:0;display:flex;flex-direction:column;padding:20px 0;}
  .brand{padding:0 20px 18px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand img{display:block;height:28px;width:auto;}
  .brand span{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--mint);opacity:.75;margin-top:6px;}
  .nav-item{padding:11px 20px;font-size:14px;cursor:pointer;color:var(--mint);opacity:.8;display:flex;align-items:center;gap:9px;border-left:3px solid transparent;}
  .nav-item:hover{background:rgba(255,255,255,.06);opacity:1;color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.08);color:#fff;opacity:1;border-left-color:var(--emerald);font-weight:600;}
  .nav-section{padding:14px 20px 4px 20px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mint);opacity:.55;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;}
  .topbar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .topbar-title{font-size:15px;font-weight:700;}
  select, input[type=text], input[type=email], input[type=date], textarea{
    font-family:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  textarea{width:100%;resize:vertical;min-height:70px;line-height:1.4;}
  .content{padding:26px;flex:1;overflow-x:hidden;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;}
  .card h2{margin:0 0 4px 0;font-size:17px;}
  .card .desc{color:var(--sub);font-size:13px;margin-bottom:14px;}
  .grid{display:grid;gap:16px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid-3,.grid-2{grid-template-columns:1fr;}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
  .stat .num{font-size:26px;font-weight:800;}
  .stat .lbl{color:var(--sub);font-size:12.5px;margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{color:var(--sub);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.bad{background:var(--bad-bg);color:var(--bad);}
  .badge.neutral{background:#eef0f4;color:#5b6270;}
  .bar-wrap{background:#eef0f4;border-radius:20px;height:8px;width:100%;overflow:hidden;}
  .bar-fill{background:var(--brand);height:100%;border-radius:20px;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:none;padding:8px 15px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--cyprus);}
  .btn.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand);}
  .btn.secondary:hover{background:var(--brand-light);}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .btn.ghost:hover{background:#f2f3f6;}
  .btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad-bg);}
  .btn.danger:hover{background:var(--bad-bg);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .field .hint{color:var(--sub);font-size:12.5px;margin-bottom:6px;}
  .field select, .field input[type=text], .field input[type=email]{width:100%;}
  .rating-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .rating-row .rlabel{width:230px;font-size:13.5px;font-weight:600;flex-shrink:0;}
  .stars{display:flex;gap:4px;}
  .star{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--sub);}
  .star.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .pop{color:var(--emerald);}
  .pill-select{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{padding:7px 13px;border:1px solid var(--line);border-radius:20px;font-size:13px;cursor:pointer;background:#fff;}
  .pill.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .divider{height:1px;background:var(--line);margin:18px 0;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .muted{color:var(--sub);}
  .small{font-size:12.5px;}
  .tag{background:var(--brand-light);color:var(--brand);padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .dept-tag{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:6px 8px 6px 14px;font-size:13px;}
  .quote-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fafafe;}
  .quote-card .meta{font-size:11.5px;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px;}
  .empty{color:var(--sub);font-size:13.5px;padding:20px 0;text-align:center;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--cyprus);color:var(--mint);padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand);}
  .modal-bg{position:fixed;inset:0;background:rgba(11,59,46,.45);display:flex;align-items:center;justify-content:center;z-index:200;}
  .modal{background:#fff;border-radius:14px;padding:22px 24px;width:440px;max-width:92vw;max-height:86vh;overflow:auto;}
  .modal h3{margin-top:0;}
  .close-x{float:right;cursor:pointer;color:var(--sub);font-size:18px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}

// One-time HR bootstrap action: pushes the real org chart into Firestore. Safe to run more
// than once (writes use merge:true) — only needed the first time the database is empty.
async function seedFirestoreFromOrgData(){
  const data = seedOrgData();
  const batch1 = fdb.batch();
  data.people.forEach(p=>{
    const {id, ...rest} = p;
    batch1.set(fdb.collection('people').doc(id), rest, {merge:true});
  });
  await batch1.commit();
  const batch2 = fdb.batch();
  data.cycles.forEach(c=>{
    const {id, ...rest} = c;
    batch2.set(fdb.collection('cycles').doc(id), rest, {merge:true});
  });
  batch2.set(fdb.collection('settings').doc('main'), {companyDomain:data.settings.companyDomain, departments:data.departments}, {merge:true});
  await batch2.commit();
}

/* In-memory mirror of Firestore, kept in sync via onSnapshot listeners below.
   The rest of the app reads/renders from this object exactly like the old localStorage version did. */
let DB = {departments:[], people:[], cycles:[], settings:{companyDomain:'plei.com'}, reviews:{self:[], manager:[], peer:[], upward:[]}, suggestions:[]};
let DB_LOADED = false;
let CURRENT_USER = null; // {uid, email}

function myLocalId(email){ return (email||'').split('@')[0]; }
function mergeById(a, b){
  const map = new Map();
  a.forEach(r=>map.set(r.id, r));
  b.forEach(r=>map.set(r.id, r));
  return Array.from(map.values());
}

let reviewListenerUnsubs = [];
function stopReviewListeners(){ reviewListenerUnsubs.forEach(u=>u()); reviewListenerUnsubs = []; }

function startReviewListeners(email, isHR){
  stopReviewListeners();
  if(isHR){
    reviewListenerUnsubs.push(fdb.collection('reviews_self').onSnapshot(snap=>{ DB.reviews.self = snap.docs.map(d=>Object.assign({id:d.id}, d.data())); if(DB_LOADED) render(); }, e=>console.error(e)));

let peopleUnsub=null, cyclesUnsub=null, settingsUnsub=null, suggestionsUnsub=null;
function stopBaseListeners(){
  [peopleUnsub, cyclesUnsub, settingsUnsub, suggestionsUnsub].forEach(u=>{ if(u) u(); });
  peopleUnsub = cyclesUnsub = settingsUnsub = suggestionsUnsub = null;
}

let lastReviewListenerMode = null;
function onPeopleSynced(){
  if(!CURRENT_USER) return;
  const me = DB.people.find(p=>p.id===myLocalId(CURRENT_USER.email));
  const isHR = !!(me && me.role==='hr');
  const mode = isHR ? 'hr' : ('self:'+CURRENT_USER.email);
  if(mode !== lastReviewListenerMode){
    lastReviewListenerMode = mode;
    startReviewListeners(CURRENT_USER.email, isHR);
  }
}

function startBaseListeners(onFirstLoad){
  stopBaseListeners();
  let pending = new Set(['people','cycles','settings','suggestions']);
  function done(key){ pending.delete(key); if(pending.size===0 && onFirstLoad){ const cb=onFirstLoad; onFirstLoad=null; cb(); } }
  peopleUnsub = fdb.collection('people').onSnapshot(snap=>{
    DB.people = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    onPeopleSynced();
    done('people');
    if(DB_LOADED) render();
  }, e=>{ console.error(e); done('people'); });
  cyclesUnsub = fdb.collection('cycles').onSnapshot(snap=>{
    DB.cycles = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    done('cycles');
    if(DB_LOADED) render();
  }, e=>{ console.error(e); done('cycles'); });
  settingsUnsub = fdb.collection('settings').doc('main').onSnapshot(doc=>{
    const d = doc.data() || {};
    DB.settings = {companyDomain: d.companyDomain || 'plei.com'};
    DB.departments = d.departments || [];
    done('settings');
    if(DB_LOADED) render();
  }, e=>{ console.error(e); done('settings'); });
  suggestionsUnsub = fdb.collection('suggestions').onSnapshot(snap=>{
    DB.suggestions = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    done('suggestions');
    if(DB_LOADED) render();
  }, e=>{ console.error(e); done('suggestions'); });
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function findReview(type, cycleId, matchFn){ return DB.reviews[type].find(r=>r.cycleId===cycleId && matchFn(r)); }

function avg(arr){ if(!arr.length) return null; return arr.reduce((a,b)=>a+b,0)/arr.length; }
function ratingAvgOfReview(r){ if(!r || !r.ratings) return null; const vals=Object.values(r.ratings); return avg(vals); }

}

function initApp(){
  fauth.onAuthStateChanged(user=>{
    if(!user){
      CURRENT_USER = null;
      DB_LOADED = false;
      stopBaseListeners();
      stopReviewListeners();
      lastReviewListenerMode = null;
      STATE.sessionPersonId = null;
      STATE.previewPersonId = null;
      renderLogin();
      return;
    }
    const email = (user.email||'').toLowerCase();
    const domain = email.split('@')[1];
    if(domain !== 'plei.com'){
      renderLogin('Please sign in with your Plei Google account (@plei.com).');
      fauth.signOut();
      return;
    }
    LOGIN_ERROR = null;
    CURRENT_USER = {uid:user.uid, email};
    startBaseListeners(()=>{
      const person = DB.people.find(p=>p.email.toLowerCase()===email);
      if(!person){ renderLogin("We couldn't find an account for that email. Ask HR to add you to Plei and send you an invite."); fauth.signOut(); return; }
      if(!person.invited){ renderLogin("Your account exists but hasn't been invited yet. Ask HR to send you an invite."); fauth.signOut(); return; }
      if(!person.active){
        fdb.collection('people').doc(person.id).update({active:true, lastLoginAt:new Date().toISOString()}).catch(e=>console.error(e));
      }
      STATE.sessionPersonId = person.id;
      STATE.previewPersonId = null;
      STATE.viewAs = person.id;
      STATE.nav = null;
      DB_LOADED = true;
      render();
    });
  });
}

/* ============================= RENDER ROOT ============================= */
function render(){
  STATE.viewAs = STATE.previewPersonId || STATE.sessionPersonId;
  const person = currentPerson();
  if(!person){ renderLogin(); return; }
  const sp = sessionPerson();
  const role = person.role;
  const root = document.getElementById('root');

  // Firestore is provisioned but hasn't been seeded with the real org chart / cycles yet.

  contentArea.innerHTML = renderView(STATE.nav, cycle, person);

function renderView(nav, cycle, person){
  switch(nav){
    case 'dashboard': return viewHRDashboard(cycle);
    case 'cycles': return viewCycles();
    case 'org': return viewOrg();
    case 'tracking': return viewManagerTracking(cycle);
    case 'selftracking': return viewSelfTracking(cycle);
    case 'peer': return viewPeerHR(cycle);
    case 'upward': return viewUpwardHR(cycle);
    case 'analytics': return viewAnalytics();
    case 'suggestions': return viewSuggestions(true);
    case 'myteam': return viewMyTeam(cycle, person);
    case 'myself': return viewSelfForm(cycle, person);
    case 'peerform': return viewPeerForm(cycle, person);
    case 'upwardform': return viewUpwardForm(cycle, person);
    case 'suggestform': return viewSuggestForm(person);
    case 'myreports': return viewMyReports(cycle, person);
    case 'myreviews': return viewMyReviews(cycle, person);
  }
  return '<div class="empty">Nothing to show.</div>';
}

/* ============================= HR: DASHBOARD ============================= */
function viewHRDashboard(cycle){
  const employees = DB.people;
  const managers = managersList();
  const selfDone = DB.reviews.self.filter(r=>r.cycleId===cycle.id && r.status==='submitted').length;
  const mgrReviewsExpected = DB.people.filter(e=>e.managerId).length;
  const mgrDone = DB.reviews.manager.filter(r=>r.cycleId===cycle.id && r.status==='submitted').length;
  const peerCount = DB.reviews.peer.filter(r=>r.cycleId===cycle.id).length;
  const upwardCount = DB.reviews.upward.filter(r=>r.cycleId===cycle.id).length;

  const overallScores = DB.reviews.manager.filter(r=>r.cycleId===cycle.id).map(ratingAvgOfReview).filter(Boolean);
  const overallAvg = avg(overallScores);

  return `
  <div class="card">
    <h2>${cycle.label}</h2>
    <div class="desc">${fmtDate(cycle.startDate)} to ${fmtDate(cycle.endDate)} · Status: <span class="badge ${cycle.status==='open'?'ok':'neutral'}">${cycle.status==='open'?'Open':'Closed'}</span></div>
  </div>
  <div class="grid grid-3">
    <div class="stat"><div class="num">${mgrDone}/${mgrReviewsExpected}</div><div class="lbl">Manager reviews completed</div></div>
    <div class="stat"><div class="num">${selfDone}/${employees.length}</div><div class="lbl">Self-reviews completed</div></div>
    <div class="stat"><div class="num">${overallAvg?overallAvg.toFixed(1):'—'}</div><div class="lbl">Overall average score (1-5)</div></div>
    <div class="stat"><div class="num">${peerCount}</div><div class="lbl">Peer reviews received</div></div>
    <div class="stat"><div class="num">${upwardCount}</div><div class="lbl">Upward reviews received</div></div>
    <div class="stat"><div class="num">${managers.length}</div><div class="lbl">Active managers</div></div>
  </div>
  <div class="card">
    <h2>Completion by manager</h2>
    <div class="desc">Manager review progress for this cycle</div>
    ${managers.map(m=>{
      const reports = directReports(m.id);
      const done = reports.filter(r=>findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted')).length;
      const pct = reports.length ? Math.round(done/reports.length*100) : 0;
      return `<div style="margin-bottom:14px;">
        <div class="row" style="justify-content:space-between;">
          <div class="person-cell"><div class="avatar">${initials(m.name)}</div><div><b>${m.name}</b> <span class="muted small">· ${m.department}</span></div></div>
          <div class="small muted">${done}/${reports.length} completed</div>
        </div>
        <div class="bar-wrap" style="margin-top:6px;"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('')}
  </div>
  <div class="card">
    <h2>Quick links</h2>
    <div class="row">
      <button class="btn secondary" data-nav="cycles">Set cycle dates</button>
      <button class="btn secondary" data-nav="analytics">View full analytics</button>
      <button class="btn secondary" data-nav="suggestions">View suggestions</button>
    </div>
  </div>`;
}

/* ============================= HR: CYCLES ============================= */
function viewCycles(){
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div><h2>Review cycles</h2><div class="desc">Organized by year and type (Mid-Year / End-of-Year). Set the start and end dates for each process.</div></div>
      <button class="btn" id="newCycleBtn">+ New cycle</button>
    </div>
    <table>
      <thead><tr><th>Cycle</th><th>Year</th><th>Type</th><th>Start</th><th>End</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${DB.cycles.slice().sort((a,b)=>b.year-a.year || (a.type<b.type?1:-1)).map(c=>`
          <tr>
            <td><b>${c.label}</b></td>
            <td>${c.year}</td>
            <td>${c.type==='mid'?'Mid-Year':'End-of-Year'}</td>
            <td>${fmtDate(c.startDate)}</td>
            <td>${fmtDate(c.endDate)}</td>
            <td><span class="badge ${c.status==='open'?'ok':'neutral'}">${c.status==='open'?'Open':'Closed'}</span></td>
            <td>
              <button class="btn ghost sm" data-edit-cycle="${c.id}">Edit</button>
              <button class="btn ghost sm" data-toggle-cycle="${c.id}">${c.status==='open'?'Close':'Reopen'}</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function cycleModal(existingId){
  const c = existingId ? getCycle(existingId) : null;
  const modalHtml = `
  <div class="modal-bg no-print" id="cycleModalBg">
    <div class="modal">
      <span class="close-x" id="closeCycleModal">✕</span>
      <h3>${c?'Edit cycle':'New review cycle'}</h3>
      <div class="field"><label>Year</label><input type="text" id="cy_year" value="${c?c.year:new Date().getFullYear()}"></div>
      <div class="field"><label>Type</label>
        <div class="pill-select">
          <div class="pill ${(!c||c.type==='mid')?'on':''}" data-type="mid">Mid-Year</div>
          <div class="pill ${c&&c.type==='end'?'on':''}" data-type="end">End-of-Year</div>
        </div>
      </div>
      <div class="field"><label>Start date</label><input type="date" id="cy_start" value="${c?c.startDate:''}"></div>
      <div class="field"><label>End date</label><input type="date" id="cy_end" value="${c?c.endDate:''}"></div>
      <button class="btn" id="saveCycleBtn" style="width:100%;">Save cycle</button>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  let selType = c ? c.type : 'mid';
  document.querySelectorAll('#cycleModalBg [data-type]').forEach(el=>el.addEventListener('click', ()=>{
    selType = el.dataset.type;
    document.querySelectorAll('#cycleModalBg [data-type]').forEach(x=>x.classList.toggle('on', x.dataset.type===selType));
  }));
  document.getElementById('closeCycleModal').addEventListener('click', ()=>document.getElementById('cycleModalBg').remove());
  document.getElementById('saveCycleBtn').addEventListener('click', async ()=>{
    const year = document.getElementById('cy_year').value.trim();

async function deletePerson(id){
  if(id===STATE.sessionPersonId){ alert("You can't delete your own account while signed in."); return; }
  const p = getPerson(id);
  if(!p) return;
  if(!confirm(`Remove ${p.name} from the organization? This will also delete their review history and unassign anyone reporting to them.`)) return;
  const batch = fdb.batch();
  batch.delete(fdb.collection('people').doc(id));
  DB.people.forEach(x=>{ if(x.managerId===id) batch.update(fdb.collection('people').doc(x.id), {managerId:null}); });
  DB.reviews.self.filter(r=>r.employeeId===id).forEach(r=>batch.delete(fdb.collection('reviews_self').doc(r.id)));
  DB.reviews.manager.filter(r=>r.employeeId===id || r.managerId===id).forEach(r=>batch.delete(fdb.collection('reviews_manager').doc(r.id)));
  DB.reviews.peer.filter(r=>r.targetId===id || r._authorTag===id).forEach(r=>batch.delete(fdb.collection('reviews_peer').doc(r.id)));
  DB.reviews.upward.filter(r=>r.managerId===id || r._authorTag===id).forEach(r=>batch.delete(fdb.collection('reviews_upward').doc(r.id)));
  await batch.commit();
  if(STATE.previewPersonId===id) STATE.previewPersonId=null;
  toast('Person removed'); render();
}

      const newDepartments = DB.departments.map(d=>d===existingName?name:d);
      const batch = fdb.batch();
      batch.set(fdb.collection('settings').doc('main'), {companyDomain:DB.settings.companyDomain, departments:newDepartments}, {merge:true});

async function deleteDept(name){
  const count = DB.people.filter(p=>p.department===name).length;
  if(count>0){ alert(`Can't delete "${name}": ${count} ${count===1?'person is':'people are'} still assigned to it. Reassign them from the person editor first.`); return; }
  if(!confirm(`Delete the "${name}" department?`)) return;
  await fdb.collection('settings').doc('main').set({companyDomain:DB.settings.companyDomain, departments:DB.departments.filter(d=>d!==name)}, {merge:true});
  toast('Department deleted'); render();
}

function ratingRowHtml(field, current){
  const val = current||0;
  return `<div class="rating-row" data-rating-field="${field.key}">
    <div class="rlabel">${field.label}</div>
    <div class="stars">${[1,2,3,4,5].map(n=>`<div class="star ${n<=val?'on':''}" data-star="${n}">${n}</div>`).join('')}</div>
    <div class="small muted" data-rating-text style="width:150px;">${val?RATING_LABELS[val]:'Not rated'}</div>
  </div>`;
}
function bindRatingRow(container, field, onChange){
  const row = container.querySelector(`[data-rating-field="${field.key}"]`);
  if(!row) return;
  row.querySelectorAll('.star').forEach(starEl=>{
    starEl.addEventListener('click', ()=>{
      const val = +starEl.dataset.star;
      row.querySelectorAll('.star').forEach(s=>s.classList.toggle('on', +s.dataset.star<=val));
      row.querySelector('[data-rating-text]').textContent = RATING_LABELS[val];
      onChange(val);
    });
  });
}

function bindViewEvents(role, nav, cycle, person){

  document.getElementById('newCycleBtn')?.addEventListener('click', ()=>cycleModal(null));

  }));
  document.getElementById('saveDomainBtn')?.addEventListener('click', async ()=>{
    const val = document.getElementById('companyDomainInput').value.trim().toLowerCase().replace(/^@/,'');

  document.getElementById('newPersonBtn')?.addEventListener('click', ()=>personModal(null));
  document.querySelectorAll('[data-edit-person]').forEach(el=>el.addEventListener('click', ()=>personModal(el.dataset.editPerson)));

  document.querySelectorAll('[data-invite-person]').forEach(el=>el.addEventListener('click', ()=>inviteModal(el.dataset.invitePerson)));

  document.querySelectorAll('[data-edit-dept]').forEach(el=>el.addEventListener('click', ()=>deptModal(el.dataset.editDept)));
  document.querySelectorAll('[data-delete-dept]').forEach(el=>el.addEventListener('click', ()=>deleteDept(el.dataset.deleteDept)));
  document.querySelectorAll('[data-nav]').forEach(el=>{ if(el.closest('.card')) el.addEventListener('click', ()=>{ STATE.nav = el.dataset.nav; render(); }); });

  if(nav==='analytics') setTimeout(drawAnalyticsCharts, 30);

  // Manager: team list -> open review form / read self-review
  document.querySelectorAll('[data-fill-manager]').forEach(el=>el.addEventListener('click', ()=>{
    const emp = getPerson(el.dataset.fillManager);
    const host = document.getElementById('managerFormHost');

    selfReviewModal(cycle, getPerson(el.dataset.viewSelf));
  }));

  // Self review form
  bindSelfFormEvents(cycle, person);
  bindPeerFormEvents(cycle, person);
  bindUpwardFormEvents(cycle, person);
  bindSuggestFormEvents(person);

  document.getElementById('printSelfBtn')?.addEventListener('click', ()=>printHtml(buildSelfOnlyPrintable(cycle, person)));
  document.getElementById('printSelfBtn2')?.addEventListener('click', ()=>printHtml(buildSelfOnlyPrintable(cycle, person)));
  document.querySelectorAll('[data-print-combined]').forEach(el=>el.addEventListener('click', ()=>{
    const emp = getPerson(el.dataset.printCombined);
    printHtml(buildCombinedPrintable(cycle, emp));
  }));
  document.querySelectorAll('[data-print-self]').forEach(el=>el.addEventListener('click', ()=>{
    const emp = getPerson(el.dataset.printSelf);
    printHtml(buildSelfOnlyPrintable(cycle, emp));
  }));
  document.querySelectorAll('[data-print-peer]').forEach(el=>el.addEventListener('click', ()=>{
    const rev = DB.reviews.peer.find(r=>r.id===el.dataset.printPeer);
    if(rev) printHtml(buildPeerPrintable(getCycle(rev.cycleId), rev));
  }));
}

function bindManagerFormEvents(cycle, manager, employee){
  const host = document.getElementById('managerFormHost');
  const existing = findReview('manager', cycle.id, x=>x.employeeId===employee.id) || {ratings:{}, answers:{}};
  const ratings = Object.assign({}, existing.ratings);
  MANAGER_RATINGS.forEach(f=>bindRatingRow(host, f, val=>ratings[f.key]=val));
  host.querySelector('[data-close-manager-form]')?.addEventListener('click', ()=>{ host.innerHTML=''; });

  function collectAnswers(){
    const answers = {};
    MANAGER_FIELDS.forEach(f=>{ answers[f.key] = host.querySelector(`[data-mgr-field="${f.key}"]`).value; });
    return answers;
  }
  async function upsert(status){
    const rev = findReview('manager', cycle.id, x=>x.employeeId===employee.id);
    const id = rev ? rev.id : uid('mr');
    await fdb.collection('reviews_manager').doc(id).set({
      cycleId:cycle.id, managerId:manager.id, managerEmail:manager.email,
      employeeId:employee.id, employeeEmail:employee.email,
      ratings, answers:collectAnswers(), status, submittedAt:new Date().toISOString()
    }, {merge:true});
  }
  host.querySelector('#submitManagerReview')?.addEventListener('click', async ()=>{
    const missing = MANAGER_RATINGS.filter(f=>!ratings[f.key]);
    if(missing.length){ alert('Please complete all ratings before submitting.'); return; }
    await upsert('submitted'); toast('Review submitted'); render();
  });
  host.querySelector('#saveDraftManagerReview')?.addEventListener('click', async ()=>{ await upsert('draft'); toast('Draft saved'); });
}

function bindSelfFormEvents(cycle, person){
  const submitBtn = document.getElementById('submitSelfReview');
  const draftBtn = document.getElementById('saveDraftSelfReview');
  if(!submitBtn && !draftBtn) return;
  function collect(){
    const answers = {};
    SELF_FIELDS.forEach(f=>{ const el = document.querySelector(`[data-self-field="${f.key}"]`); answers[f.key]=el?el.value:''; });
    return answers;
  }
  async function upsert(status){
    const rev = findReview('self', cycle.id, x=>x.employeeId===person.id);
    const id = rev ? rev.id : uid('sr');
    const mgr = person.managerId ? getPerson(person.managerId) : null;
    await fdb.collection('reviews_self').doc(id).set({
      cycleId:cycle.id, employeeId:person.id, employeeEmail:person.email, managerEmail: mgr ? mgr.email : null,
      answers: collect(), status, submittedAt:new Date().toISOString()
    }, {merge:true});
  }
  submitBtn?.addEventListener('click', async ()=>{ await upsert('submitted'); toast('Self-review submitted — your manager can now read it'); render(); });
  draftBtn?.addEventListener('click', async ()=>{ await upsert('draft'); toast('Draft saved'); });
}

function bindPeerFormEvents(cycle, person){
  const submitBtn = document.getElementById('submitPeerReview');
  if(!submitBtn) return;
  const ratings = {};
  PEER_RATINGS.forEach(f=>bindRatingRow(document, f, val=>ratings[f.key]=val));
  submitBtn.addEventListener('click', async ()=>{
    const missing = PEER_RATINGS.filter(f=>!ratings[f.key]);
    if(missing.length){ alert('Please complete the ratings before submitting.'); return; }
    const targetId = document.getElementById('peerTarget').value;
    const answers = {};
    PEER_FIELDS.forEach(f=>{ answers[f.key] = document.querySelector(`[data-peer-field="${f.key}"]`).value; });
    if(!answers.strengths){ alert('Please fill in at least the strengths field.'); return; }
    await fdb.collection('reviews_peer').doc(uid('pr')).set({cycleId:cycle.id, targetId, targetDept:document.getElementById('peerDept').value, anonymous:true, _authorTag:person.id, authorEmail:person.email, ratings, answers});
    toast('Peer review submitted anonymously'); render();
  });
}

function bindUpwardFormEvents(cycle, person){
  const submitBtn = document.getElementById('submitUpwardReview');
  if(!submitBtn) return;
  const ratings = {};
  UPWARD_RATINGS.forEach(f=>bindRatingRow(document, f, val=>ratings[f.key]=val));
  submitBtn.addEventListener('click', async ()=>{
    const missing = UPWARD_RATINGS.filter(f=>!ratings[f.key]);
    if(missing.length){ alert('Please complete the ratings before submitting.'); return; }
    const answers = {};
    UPWARD_FIELDS.forEach(f=>{ answers[f.key] = document.querySelector(`[data-upward-field="${f.key}"]`).value; });
    await fdb.collection('reviews_upward').doc(uid('ur')).set({cycleId:cycle.id, managerId:person.managerId, department:person.department, anonymous:true, _authorTag:person.id, authorEmail:person.email, ratings, answers});
    toast('Review submitted anonymously to HR'); render();
  });
}

function bindSuggestFormEvents(person){
  const submitBtn = document.getElementById('submitSuggestion');
  if(!submitBtn) return;
  submitBtn.addEventListener('click', async ()=>{
    const text = document.getElementById('sg_text').value.trim();
    if(!text){ alert('Please write your suggestion.'); return; }
    const anon = document.getElementById('sg_anon').checked;
    await fdb.collection('suggestions').doc(uid('sg')).set({cycleId:STATE.activeCycleId, anonymous:anon, authorName:anon?'':person.name,
      category:document.getElementById('sg_cat').value, text, createdAt:new Date().toISOString().slice(0,10)});
    toast('Suggestion submitted'); render();
  });
}

initApp();
</script>
