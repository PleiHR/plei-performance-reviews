<style>
  :root{
    /* Plei Brand Guide v1.0 (updated May 2026) */
    --cyprus:#0B3B2E; --pitch:#16755C; --emerald:#4ADE80; --mint:#E6FAF5;
    --pebble:#f1f1f1; --midnight:#171d1a; --claret:#511124; --sangria:#FF6333;

    --bg:var(--pebble); --panel:#ffffff; --ink:var(--cyprus); --sub:#5c7c74; --line:#e1e5e2;
    --brand:var(--pitch); --brand-ink:#ffffff; --brand-light:var(--mint);
    --ok:var(--pitch); --ok-bg:var(--mint); --warn:#8a5a12; --warn-bg:#fbeedd; --bad:var(--claret); --bad-bg:#f6e6ea;
    --r:12px;
    --font-head:'Clash Grotesk','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);}
  h1,h2,h3,.card h2,.brand,.topbar-title,.login-card h1,.stat .num{font-family:var(--font-head);font-weight:600;}
  a{color:inherit;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:250px;background:var(--cyprus);color:#fff;flex-shrink:0;display:flex;flex-direction:column;padding:20px 0;}
  .brand{padding:0 20px 18px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand img{display:block;height:28px;width:auto;}
  .brand span{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--mint);opacity:.75;margin-top:6px;}
  .nav-item{padding:11px 20px;font-size:14px;cursor:pointer;color:var(--mint);opacity:.8;display:flex;align-items:center;gap:9px;border-left:3px solid transparent;}
  .nav-item:hover{background:rgba(255,255,255,.06);opacity:1;color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.08);color:#fff;opacity:1;border-left-color:var(--emerald);font-weight:600;}
  .nav-section{padding:14px 20px 4px 20px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mint);opacity:.55;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;}
  .topbar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .topbar-title{font-size:15px;font-weight:700;}
  select, input[type=text], input[type=email], input[type=date], textarea{
    font-family:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  textarea{width:100%;resize:vertical;min-height:70px;line-height:1.4;}
  .content{padding:26px;flex:1;overflow-x:hidden;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;}
  .card h2{margin:0 0 4px 0;font-size:17px;}
  .card .desc{color:var(--sub);font-size:13px;margin-bottom:14px;}
  .grid{display:grid;gap:16px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.grid-3,.grid-2,.grid-4{grid-template-columns:1fr;}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
  .stat.bad{border-color:var(--bad);}
  .stat.warn{border-color:var(--warn);}
  .stat.warn .num{color:var(--warn);}
  .stat .num{font-size:26px;font-weight:800;}
  .stat .lbl{color:var(--sub);font-size:12.5px;margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{color:var(--sub);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.bad{background:var(--bad-bg);color:var(--bad);}
  .badge.neutral{background:#eef0f4;color:#5b6270;}
  /* --- Redesign: new design-system components (brief Aug 26 2026) --- */
  .stpill{display:inline-flex;align-items:center;justify-content:center;width:92px;height:22px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
  .stpill.ok{background:var(--ok-bg);color:var(--ok);}
  .stpill.warn{background:var(--warn-bg);color:var(--warn);}
  .stpill.bad{background:var(--bad-bg);color:var(--bad);}
  .stpill.neutral{background:#eef0f4;color:#5b6270;}
  .stpill.info{background:#e7eefb;color:#2b5fb0;}
  .score{display:inline-flex;align-items:center;justify-content:center;width:44px;height:22px;border-radius:7px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--ok-bg);color:var(--ok);flex-shrink:0;}
  .score.warn{background:var(--warn-bg);color:var(--warn);}
  .score.bad{background:var(--bad-bg);color:var(--bad);}
  .score.na{background:#f3f4f3;color:#8a968f;}
  .sevtag{display:inline-flex;align-items:center;justify-content:center;width:92px;height:22px;border-radius:5px;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0;color:#fff;}
  .sevtag.pip{background:var(--bad);}
  .sevtag.mon{background:#e0a63a;}
  .sevtag.ok{background:transparent;color:var(--ok);border:1px solid var(--ok);}
  .chip{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a968f;}
  .actbtn{display:inline-flex;align-items:center;justify-content:center;width:84px;height:24px;font-size:11.5px;font-weight:500;color:var(--ink);background:#fff;border:1px solid #d4dcd7;border-radius:7px;white-space:nowrap;overflow:hidden;cursor:pointer;flex-shrink:0;}
  .actbtn:hover{border-color:#9fb0a7;}
  .bar-wrap{background:#eef0f4;border-radius:20px;height:8px;width:100%;overflow:hidden;}
  .bar-fill{background:var(--brand);height:100%;border-radius:20px;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:none;padding:8px 15px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--cyprus);}
  .btn.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand);}
  .btn.secondary:hover{background:var(--brand-light);}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .btn.ghost:hover{background:#f2f3f6;}
  .btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad-bg);}
  .btn.danger:hover{background:var(--bad-bg);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .field .hint{color:var(--sub);font-size:12.5px;margin-bottom:6px;}
  .field select, .field input[type=text], .field input[type=email]{width:100%;}
  .rating-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}

/* Local-only draft autosave: protects in-progress anonymous/long-form answers from
   being wiped if a Firestore listener triggers a re-render while the tab was
   backgrounded (e.g. the user tabs away mid-review and comes back later).
   Never leaves the browser — cleared automatically once the review is submitted. */
function draftKey(kind, cycleId, personId, extra){
  return 'plei_draft_' + kind + '_' + cycleId + '_' + personId + (extra?('_'+extra):'');
}
function saveLocalDraft(key, data){
  try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){}
}
function loadLocalDraft(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearLocalDraft(key){
  try{ localStorage.removeItem(key); }catch(e){}
}

/* Generic debounced autosave, used by any "autosaving textarea" (Department Report's YOUR
   SUMMARY / recommendation fields, Manager Reports' recommendation field, etc.) — saves to
   Firestore ~900ms after the user stops typing rather than on every keystroke or a manual button.
   Firestore's onSnapshot listener re-renders the whole app on write, which would normally yank
   focus out of the textarea mid-edit; wireAutosaveTextarea + restoreAutosaveFocus below track
   which field was focused and restore focus/cursor position after that re-render settles. */
const AUTOSAVE_TIMERS = {};
function debounceAutosave(key, fn, delay){
  clearTimeout(AUTOSAVE_TIMERS[key]);
  AUTOSAVE_TIMERS[key] = setTimeout(fn, delay || 900);
}
function wireAutosaveTextarea(el, onSave, opts){
  opts = opts || {};
  const id = el.dataset.autosaveId;
  const localKey = opts.localKey;
  el.addEventListener('focus', ()=>{ STATE.autosaveFocusId = id; });
  el.addEventListener('blur', ()=>{ if(STATE.autosaveFocusId===id) STATE.autosaveFocusId = null; });
  el.addEventListener('input', ()=>{
    if(localKey) saveLocalDraft(localKey, el.value);
    const statusEl = document.querySelector(`[data-save-status-for="${id}"]`);
    if(statusEl) statusEl.textContent = 'Saving...';
    debounceAutosave(id, async ()=>{
      try{
        await onSave(el.value);
        if(localKey) clearLocalDraft(localKey);
        const s = document.querySelector(`[data-save-status-for="${id}"]`);
        if(s) s.textContent = 'Saved';
      }catch(e){
        console.error('autosave failed:', e);
        const s = document.querySelector(`[data-save-status-for="${id}"]`);
        if(s) s.textContent = 'Save failed: ' + e.message;
      }
    }, opts.delay || 900);
  });
}
function restoreAutosaveFocus(){
  if(!STATE.autosaveFocusId) return;
  const el = document.querySelector(`[data-autosave-id="${STATE.autosaveFocusId}"]`);
  if(!el) return;
  el.focus();
  const v = el.value;
  try{ el.setSelectionRange(v.length, v.length); }catch(e){}
}

// One-time HR bootstrap action: pushes the real org chart into Firestore. Safe to run more
// than once (writes use merge:true) — only needed the first time the database is empty.
async function seedFirestoreFromOrgData(){
  const data = seedOrgData();
  const batch1 = fdb.batch();
  data.people.forEach(p=>{
    const {id, ...rest} = p;
    batch1.set(fdb.collection('people').doc(id), rest, {merge:true});
  });
  await batch1.commit();
  const batch2 = fdb.batch();
  data.cycles.forEach(c=>{
    const {id, ...rest} = c;
    batch2.set(fdb.collection('cycles').doc(id), rest, {merge:true});
  });
  batch2.set(fdb.collection('settings').doc('main'), {companyDomain:data.settings.companyDomain, departments:data.departments}, {merge:true});
  await batch2.commit();
}

let peopleUnsub=null, cyclesUnsub=null, settingsUnsub=null, suggestionsUnsub=null, directoryUnsub=null;
let selfDocUnsub=null, fullPeopleUnsub=null, subtreeUnsub=null, RAW_PEOPLE=[];

function stopBaseListeners(){
  [peopleUnsub, cyclesUnsub, settingsUnsub, suggestionsUnsub, directoryUnsub, selfDocUnsub, fullPeopleUnsub, subtreeUnsub].forEach(u=>{ if(u) u(); });
  peopleUnsub = cyclesUnsub = settingsUnsub = suggestionsUnsub = directoryUnsub = selfDocUnsub = fullPeopleUnsub = subtreeUnsub = null;
  RAW_PEOPLE = [];
}

// Only HR can read the whole `people` collection now (it holds email/role/manager-chain — the
// sensitive fields). Everyone else's client only ever receives their own doc plus, if they manage
// people, their own reporting subtree (via managerChain array-contains, enforced by the Firestore
// rules — not just hidden in the UI). `directory` is a separate, intentionally minimal collection
// (name/department/email/deactivated only, no role, no org chart) that every signed-in @plei.com
// user can read — it's what powers "pick a colleague" pickers and showing your own manager's name,
// without handing every employee's browser the full HR-sensitive record for the whole company.
function recomputePeopleView(){
  const dirMap = new Map((DB.directory||[]).map(d=>[d.id, d]));
  const rawMap = new Map(RAW_PEOPLE.map(p=>[p.id, p]));
  dirMap.forEach((d, id)=>{ if(!rawMap.has(id)) rawMap.set(id, Object.assign({id}, d)); });
  DB.people = Array.from(rawMap.values());
  onPeopleSynced();
}

let lastReviewListenerMode = null;
function onPeopleSynced(){
  if(!CURRENT_USER) return;
  const me = DB.people.find(p=>(p.email||'').toLowerCase()===CURRENT_USER.email);
  const isHR = !!(me && me.role==='hr');
  const mode = isHR ? 'hr' : ('self:'+CURRENT_USER.email);
  if(mode !== lastReviewListenerMode){
    lastReviewListenerMode = mode;
    startReviewListeners(CURRENT_USER.email, isHR);
  }
}

function startBaseListeners(onFirstLoad){
  stopBaseListeners();
  let pending = new Set(['people','cycles','settings','directory']);
  function done(key){ pending.delete(key); if(pending.size===0 && onFirstLoad){ const cb=onFirstLoad; onFirstLoad=null; cb(); } }
  directoryUnsub = fdb.collection('directory').onSnapshot(snap=>{
    DB.directory = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    recomputePeopleView();
    done('directory');
    if(DB_LOADED) render();
  }, e=>{ console.error(e); done('directory'); });
  const myId = myLocalId(CURRENT_USER ? CURRENT_USER.email : '');
  selfDocUnsub = fdb.collection('people').doc(myId).onSnapshot(doc=>{
    const selfData = doc.exists ? Object.assign({id:doc.id}, doc.data()) : null;
    const isHR = !!(selfData && selfData.role==='hr');
    if(isHR){
      if(!fullPeopleUnsub){
        fullPeopleUnsub = fdb.collection('people').onSnapshot(snap=>{
          RAW_PEOPLE = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
          recomputePeopleView(); done('people'); if(DB_LOADED) render();
        }, e=>{ console.error(e); done('people'); });
      }
    } else if(!subtreeUnsub){
      subtreeUnsub = fdb.collection('people').where('managerChain','array-contains', myId).onSnapshot(snap=>{
        const subtree = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
        const self = doc.exists ? Object.assign({id:doc.id}, doc.data()) : null;
        RAW_PEOPLE = self ? mergeById([self], subtree) : subtree;
        recomputePeopleView(); done('people'); if(DB_LOADED) render();
      }, e=>{ console.error(e); done('people'); });
    } else if(selfData){
      RAW_PEOPLE = mergeById([selfData], RAW_PEOPLE.filter(p=>p.id!==selfData.id));
      recomputePeopleView(); done('people'); if(DB_LOADED) render();
    }
  }, e=>{ console.error(e); done('people'); });
  cyclesUnsub = fdb.collection('cycles').onSnapshot(snap=>{
    DB.cycles = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    done('cycles');
    if(DB_LOADED) render();
  }, e=>{ console.error(e); done('cycles'); });
  settingsUnsub = fdb.collection('settings').doc('main').onSnapshot(doc=>{
    const d = doc.data() || {};
    DB.settings = {companyDomain: d.companyDomain || 'plei.com'};
    DB.departments = d.departments || [];
    done('settings');
    if(DB_LOADED) render();
  }, e=>{ console.error(e); done('settings'); });
}

function hasReports(personId){ return DB.people.some(p=>p.managerId===personId); }

// managerChain = list of ancestor manager IDs above a person ([directManagerId, skipManagerId, ...]).
// It's what the Firestore rules check (myId() in resource.data.managerChain) to let a manager read
// their own reporting subtree without opening up the whole `people` collection to everyone. Only HR
// flows (editing org structure) ever call these — they rely on DB.people already holding the full
// company list, which is only true when the signed-in user is HR.
function computeChainFor(managerId){
  const chain = []; let cur = managerId; let guard = 0;
  while(cur && guard < 25){
    if(chain.includes(cur)) break;
    chain.push(cur);
    const m = getPerson(cur);
    cur = m ? m.managerId : null;
    guard++;
  }
  return chain;
}
function applyChainRecursive(batch, personId, chain){
  batch.update(fdb.collection('people').doc(personId), {managerChain: chain});
  DB.people.filter(x=>x.managerId===personId).forEach(r=>applyChainRecursive(batch, r.id, [personId, ...chain]));
}
// directory mirrors only the non-sensitive fields (no role, no managerId, no invited/active) so any
// signed-in @plei.com user can read it — it's what powers "pick a colleague" pickers and showing
// someone's own manager's name, without exposing the org chart or who's HR to the whole company.
function directoryFieldsFor(p){ return {name:p.name, department:p.department, email:p.email, deactivated: !!p.deactivated, visibleInFeedback: !!p.visibleInFeedback}; }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function peerCountFor(targetId, cycleId){ const d = DB.peerCounts.find(c=>c.id===targetId+'_'+cycleId); return d?d.count:0; }
function upwardCountFor(managerId, cycleId){ const d = DB.upwardCounts.find(c=>c.id===managerId+'_'+cycleId); return d?d.count:0; }
function peerVisible(targetId, cycleId){ return peerCountFor(targetId, cycleId) >= ANONYMITY_MIN; }
function upwardVisible(managerId, cycleId){ return upwardCountFor(managerId, cycleId) >= ANONYMITY_MIN; }
function upwardSummaryFor(managerId, cycleId){ return DB.upwardSummaries.find(s=>s.id===managerId+'_'+cycleId); }
function peerSummaryFor(targetId, cycleId){ return DB.peerSummaries.find(s=>s.id===targetId+'_'+cycleId); }
function oneOnOneFor(employeeId, cycleId){ return DB.oneOnOnes.find(o=>o.id===employeeId+'_'+cycleId); }
function calendarSyncFor(personId, cycleId){ return DB.calendarSync.find(c=>c.id===personId+'_'+cycleId); }

function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const dt=new Date(iso); return dt.toLocaleString('en-US',{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}); }

    if(!gcalTokenClient){
      gcalTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_OAUTH_CLIENT_ID,
        scope: GCAL_SCOPE,
        hint: (CURRENT_USER && CURRENT_USER.email) || undefined,
        callback: ()=>{}
      });
    }
    gcalTokenClient.callback = (resp)=>{
      if(resp && resp.access_token){
        gcalAccessToken = resp.access_token;
        gcalTokenExpiry = Date.now() + (((resp.expires_in||3600)-60) * 1000);
        resolve(gcalAccessToken);
      } else {
        reject(new Error('Could not get permission to access Google Calendar.'));
      }
    };
    gcalTokenClient.error_callback = (err)=>{
      reject(new Error((err && err.message) || 'Google Calendar authorization was cancelled.'));
    };
    gcalTokenClient.requestAccessToken({prompt: ''});
  });
}
async function gcalFetch(url, options){
  const res = await fetch(url, options);
  if(!res.ok){
    let msg = 'Google Calendar error (' + res.status + ')';
    try{ const err = await res.json(); if(err && err.error && err.error.message) msg = err.error.message; }catch(e){}
    throw new Error(msg);
  }
  return await res.json();
}
async function createGcalEvent({summary, description, startISO, durationMinutes, attendeeEmails}){
  const token = await ensureGcalAuth();
  const start = new Date(startISO);
  const end = new Date(start.getTime() + (durationMinutes||ONE_ON_ONE_DEFAULT_MINUTES)*60000);
  const body = {
    summary, description,
    start: {dateTime: start.toISOString()},
    end: {dateTime: end.toISOString()},
    attendees: attendeeEmails.map(email=>({email})),
    reminders: {useDefault:true},
    conferenceData: {createRequest: {requestId: uid('meet'), conferenceSolutionKey: {type:'hangoutsMeet'}}}
  };
  return await gcalFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all&conferenceDataVersion=1', {
    method:'POST',
    headers: {'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
}
async function patchGcalEvent(eventId, {startISO, durationMinutes}){
  const token = await ensureGcalAuth();
  const start = new Date(startISO);
  const end = new Date(start.getTime() + (durationMinutes||ONE_ON_ONE_DEFAULT_MINUTES)*60000);
  return await gcalFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/'+encodeURIComponent(eventId)+'?sendUpdates=all', {
    method:'PATCH',
    headers: {'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
    body: JSON.stringify({start:{dateTime:start.toISOString()}, end:{dateTime:end.toISOString()}})
  });
}
const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.send';
let gmailAccessToken = null;
let gmailTokenExpiry = 0;
let gmailTokenClient = null;
function ensureGmailAuth(){
  return new Promise((resolve, reject)=>{
    if(gmailAccessToken && Date.now() < gmailTokenExpiry){ resolve(gmailAccessToken); return; }
    if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
      reject(new Error('Google sign-in library is still loading. Please try again in a moment.'));
      return;
    }
    if(!gmailTokenClient){
      gmailTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_OAUTH_CLIENT_ID,
        scope: GMAIL_SCOPE,
        hint: (CURRENT_USER && CURRENT_USER.email) || undefined,
        callback: ()=>{}
      });
    }
    gmailTokenClient.callback = (resp)=>{
      if(resp && resp.access_token){
        gmailAccessToken = resp.access_token;
        gmailTokenExpiry = Date.now() + (((resp.expires_in||3600)-60) * 1000);
        resolve(gmailAccessToken);
      } else {
        reject(new Error('Could not get permission to send email from your Gmail account.'));
      }
    };
    gmailTokenClient.error_callback = (err)=>{
      reject(new Error((err && err.message) || 'Gmail authorization was cancelled.'));
    };
    gmailTokenClient.requestAccessToken({prompt: ''});
  });
}
function b64urlEncodeUnicode(str){
  const utf8Bytes = new TextEncoder().encode(str);
  let binary = '';
  utf8Bytes.forEach(b=>{ binary += String.fromCharCode(b); });
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function sendGmail({to, subject, bodyHtml}){
  const token = await ensureGmailAuth();
  const fromName = (CURRENT_USER && CURRENT_USER.name) || 'Plei Performance';
  const messageLines = [
    'To: ' + to,
    'Subject: =?UTF-8?B?' + btoa(unescape(encodeURIComponent(subject))) + '?=',
    'MIME-Version: 1.0',
    'Content-Type: text/html; charset=UTF-8',
    '',
    bodyHtml
  ];
  const raw = b64urlEncodeUnicode(messageLines.join('\r\n'));
  const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/messages/send', {
    method: 'POST',
    headers: {'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
    body: JSON.stringify({raw})
  });
  if(!res.ok){
    let msg = 'Gmail error (' + res.status + ')';
    try{ const err = await res.json(); if(err && err.error && err.error.message) msg = err.error.message; }catch(e){}
    throw new Error(msg);
  }
  return await res.json();
}
async function ensureOneOnOneTask(cycle, manager, employee){

  if(snap.exists) return;
  await ref.set({

    managerId: manager.id, managerEmail: manager.email, managerName: manager.name,

    gcalEventId: null, gcalEventLink: null, meetLink: null,
    completedAt: null,
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  });
}

// Adds the cycle's start and deadline dates to the signed-in person's own Google Calendar.
// silent=true (used automatically at login) only proceeds if a token can be obtained without
// showing any prompt/popup — i.e. the person already granted Calendar access before, from
// scheduling a 1:1 or from clicking "Add to Google Calendar" once. silent=false (used by that
// manual button, always triggered by a real click) is allowed to show the Google consent popup.
async function syncCycleCalendarForPerson(person, cycle, silent){
  const id = person.id+'_'+cycle.id;
  if(calendarSyncFor(person.id, cycle.id)) return 'already';
  let token;
  try{
    token = await ensureGcalAuth();
  }catch(e){
    if(silent) return 'skipped';
    throw e;
  }
  const startEvent = await createGcalEvent({
    summary: 'Plei Performance: ' + cycle.label + ' opens',
    description: 'Your ' + cycle.label + ' performance review cycle opens today in Plei Performance.',
    startISO: new Date(cycle.startDate+'T09:00:00').toISOString(),
    durationMinutes: 30,
    attendeeEmails: []
  }).catch(e=>{ console.error('cycle start calendar event failed', e); return null; });
  const endEvent = await createGcalEvent({
    summary: 'Plei Performance: ' + cycle.label + ' deadline',
    description: 'Complete your pending performance reviews in Plei Performance before this date.',
    startISO: new Date(cycle.endDate+'T17:00:00').toISOString(),
    durationMinutes: 30,
    attendeeEmails: []
  }).catch(e=>{ console.error('cycle end calendar event failed', e); return null; });
  await fdb.collection('calendarSync').doc(id).set({
    personId: person.id, personEmail: person.email, cycleId: cycle.id, cycleLabel: cycle.label,
    startEventId: startEvent?startEvent.id:null, endEventId: endEvent?endEvent.id:null,
    syncedAt: new Date().toISOString()
  });
  return 'synced';
}
// Runs once per page load, right after login. Only ever acts silently — if the person hasn't
// granted Calendar access before, this simply does nothing and the "Add to Google Calendar"
// button in My Profile stays available for them to do it themselves, once.
let cycleCalendarAutoSyncDone = false;
async function autoSyncCycleCalendarsOnLogin(){
  if(cycleCalendarAutoSyncDone) return;
  cycleCalendarAutoSyncDone = true;
  const person = sessionPerson();
  if(!person) return;
  const openCycles = DB.cycles.filter(c=>c.status==='open');
  for(const cycle of openCycles){
    try{ await syncCycleCalendarForPerson(person, cycle, true); }
    catch(e){ console.error('auto calendar sync failed for cycle', cycle.id, e); }
  }
  if(DB_LOADED) render();
}


function findReview(type, cycleId, matchFn){ return DB.reviews[type].find(r=>r.cycleId===cycleId && matchFn(r)); }

function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function avg(arr){ if(!arr.length) return null; return arr.reduce((a,b)=>a+b,0)/arr.length; }
function ratingAvgOfReview(r){ if(!r || !r.ratings) return null; const vals=Object.values(r.ratings); return avg(vals); }

function initApp(){
  fauth.onAuthStateChanged(user=>{
    if(!user){
      CURRENT_USER = null;
      DB_LOADED = false;
      stopBaseListeners();
      stopReviewListeners();
      lastReviewListenerMode = null;
      STATE.sessionPersonId = null;
      STATE.previewPersonId = null;
      renderLogin();
      return;
    }
    const email = (user.email||'').toLowerCase();
    const domain = email.split('@')[1];
    if(domain !== 'plei.com'){
      renderLogin('Please sign in with your Plei Google account (@plei.com).');
      fauth.signOut();
      return;
    }
    LOGIN_ERROR = null;
    CURRENT_USER = {uid:user.uid, email};
    startBaseListeners(()=>{
      const person = DB.people.find(p=>p.email.toLowerCase()===email);
      if(!person){ renderLogin("We couldn't find an account for that email. Ask HR to add you to Plei and send you an invite."); fauth.signOut(); return; }
      if(person.deactivated){ renderLogin('This account has been deactivated. Contact HR if this is unexpected.'); fauth.signOut(); return; }
      if(!person.invited){ renderLogin("Your account exists but hasn't been invited yet. Ask HR to send you an invite."); fauth.signOut(); return; }
      if(!person.active){
        fdb.collection('people').doc(person.id).update({active:true, lastLoginAt:new Date().toISOString()}).catch(e=>console.error(e));
      }
      STATE.sessionPersonId = person.id;
      STATE.previewPersonId = null;
      STATE.viewAs = person.id;
      STATE.nav = null;
      DB_LOADED = true;
      render();
      autoSyncCycleCalendarsOnLogin();
    });
  });
}

  if(!STATE.activeCycleId || !getCycle(STATE.activeCycleId)){

function renderView(nav, cycle, person){
  switch(nav){
    case 'dashboard': return viewDashboard(cycle, person);
    case 'cycles': return viewCycles();
    case 'org': return viewOrg();
    case 'people': return viewPeopleProfiles(cycle);
    case 'deptSummaries': return viewDeptSummaries(cycle, person);
    case 'tracking': return viewManagerTracking(cycle);
    case 'selftracking': return viewSelfTracking(cycle);
    case 'peer': return viewPeerHR(cycle);
    case 'upward': return viewUpwardHR(cycle);
    case 'oneonones': return viewOneOnOneTracking(cycle);
    case 'analytics': return viewAnalytics();
    case 'suggestions': return viewSuggestions(true);
    case 'myteam': return viewMyTeam(cycle, person);
    case 'myself': return viewSelfForm(cycle, person);
    case 'peerform': return viewPeerForm(cycle, person);
    case 'upwardform': return viewUpwardForm(cycle, person);
    case 'suggestform': return viewSuggestForm(person);
    case 'myreports': return viewMyReports(cycle, person);
    case 'myreviews': return viewMyReviews(cycle, person);
    case 'reminders': return viewReminders(cycle);
    case 'myfeedback': return viewMyTeamFeedback(cycle, person);
    case 'howreviews': return viewHowReviewsWork(person);
    case 'todos': return viewTodos(cycle, person);
    case 'mreports': return viewManagerReports(cycle, person);
    case 'cyclepeople': return viewCyclePeople(cycle);
    case 'helpdesk': return viewHelpDesk(person);
  }
  return '<div class="empty">Nothing to show.</div>';
}

/* ============================= HR: DASHBOARD (consolidated, redesign Aug 2026) ============================= */
// One screen: stat cards, then Concerns, Departments, People, then Pending and the Suggestion
// Inbox side by side. Concerns/Departments reuse the Department Report data (Phase 4) rather than
// recomputing anything — a low score only ever *raises* a concern here, it never places a PIP tag;
// only an admin can do that, from the Department Report itself.
function dashboardConcernRows(cycle){
  const flagged = {}; // personId -> {status, department}
  DEPT_SUMMARY_GROUPS.forEach(g=>{
    const report = deptReportFor(g);
    Object.keys(report.people||{}).forEach(pid=>{
      const st = (report.people[pid]||{}).status;
      if(st && st!=='no') flagged[pid] = {status:st, department:g};
    });
  });
  const rows = [];
  DB.people.filter(p=>!p.deactivated).forEach(p=>{
    const mgrRev = findReview('manager', cycle.id, x=>x.employeeId===p.id && x.status==='submitted');
    const score = mgrRev ? ratingAvgOfReview(mgrRev) : null;
    const flag = flagged[p.id];
    if(flag){
      rows.push({person:p, label:(flag.status==='yes'?'PIP':'Monitor') + ' — set on the ' + flag.department + ' department report', score, action:'ping', department:flag.department});
    } else if(score!==null && score<3.5){
      rows.push({person:p, label:'Low score this cycle, not yet triaged', score, action:'reopen', department:deptGroupFor(p.id)});
    } else if(p.role!=='hr' && !p.managerId){
      rows.push({person:p, label:'No manager assigned', score:null, action:'reassign', department:null});
    }
  });
  return rows;
}
function dashboardPendingRows(cycle){
  const pendingSelf = DB.people.filter(p=>!p.deactivated).filter(p=>{ const r=findReview('self',cycle.id,x=>x.employeeId===p.id); return !(r&&r.status==='submitted'); });
  const pendingMgr = DB.people.filter(p=>p.managerId && !p.deactivated).filter(p=>{ const r=findReview('manager',cycle.id,x=>x.employeeId===p.id); return !(r&&r.status==='submitted'); });
  const pendingUpward = DB.people.filter(p=>p.managerId && !p.deactivated).filter(p=>!DB.upwardAuthorship.find(r=>r.cycleId===cycle.id && r.managerId===p.managerId && r.authorEmail===p.email));
  const rows = new Map();
  const add = (p, label) => { if(!rows.has(p.id)) rows.set(p.id, {person:p, missing:[]}); rows.get(p.id).missing.push(label); };
  pendingSelf.forEach(p=>add(p, 'Self-review'));
  pendingMgr.forEach(p=>add(p, 'Manager review'));
  pendingUpward.forEach(p=>add(p, 'Upward review'));
  return Array.from(rows.values()).sort((a,b)=>a.person.name.localeCompare(b.person.name));
}
function dashboardPersonDetailHtml(personId, cycle){
  const p = getPerson(personId);
  if(!p) return '<div class="empty">Person not found.</div>';
  const selfRev = findReview('self', cycle.id, x=>x.employeeId===p.id);
  const mgrRev = findReview('manager', cycle.id, x=>x.employeeId===p.id);
  const selfDone = !!(selfRev && selfRev.status==='submitted');
  const mgrDone = !!(mgrRev && mgrRev.status==='submitted');
  const score = mgrDone ? ratingAvgOfReview(mgrRev) : null;
  const dept = deptGroupFor(p.id);
  const report = dept ? deptReportFor(dept) : null;
  const admin = report && report.people ? report.people[p.id] : null;
  const note = admin && admin.recommendation ? admin.recommendation : '';
  return `
    <button class="btn ghost sm" id="backToPeopleList">← Back</button>
    <div class="row" style="justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px;">
      <div class="person-cell"><div class="avatar">${initials(p.name)}</div><div><b>${escapeHtml(p.name)}</b><div class="small muted">${escapeHtml(p.title)||''} · ${escapeHtml(p.department)}</div></div></div>
      ${scoreBadge(score)}
    </div>
    <div class="divider"></div>
    <div class="grid grid-2">
      <div><div class="small muted">Self-review</div><div style="margin-top:4px;">${selfDone?'<span class="badge ok">Submitted</span>':'<span class="badge bad">Pending</span>'}</div></div>
      <div><div class="small muted">Manager review</div><div style="margin-top:4px;">${mgrDone?'<span class="badge ok">Submitted</span>':'<span class="badge bad">Pending</span>'}</div></div>
      <div><div class="small muted">Rating</div><div style="margin-top:4px;">${scoreBadge(score)}</div></div>
      <div><div class="small muted">Cycle status</div><div style="margin-top:4px;"><span class="badge ${cycle.status==='open'?'ok':'neutral'}">${cycle.status==='open'?'Open':'Closed'}</span></div></div>
    </div>
    <div class="field" style="margin-top:14px;"><label>Note</label><p style="margin:0;font-size:13.5px;white-space:pre-wrap;">${escapeHtml(note)||'—'}</p></div>
  `;
}

function viewDashboard(cycle, person){
  const employees = DB.people.filter(p=>!p.deactivated);
  const mgrReviewsExpected = DB.people.filter(e=>e.managerId && !e.deactivated).length;
  const selfDone = DB.reviews.self.filter(r=>r.cycleId===cycle.id && r.status==='submitted').length;
  const mgrDone = DB.reviews.manager.filter(r=>r.cycleId===cycle.id && r.status==='submitted').length;
  const overallAvg = avg(DB.reviews.manager.filter(r=>r.cycleId===cycle.id).map(ratingAvgOfReview).filter(Boolean));
  const cyclePct = (employees.length+mgrReviewsExpected) ? Math.round(((selfDone+mgrDone)/(employees.length+mgrReviewsExpected))*100) : 0;
  const feedbackAuthors = new Set(DB.peerAuthorship.filter(r=>r.cycleId===cycle.id).map(r=>r.authorEmail));
  const participationPct = employees.length ? Math.round(feedbackAuthors.size/employees.length*100) : 0;

  const concernRows = dashboardConcernRows(cycle);
  const pendingRows = dashboardPendingRows(cycle);

  return `
  <div class="grid grid-4">
    <div class="stat ${concernRows.length>0?'bad':''}"><div class="num">${concernRows.length}</div><div class="lbl">Needs attention</div></div>
    <div class="stat"><div class="num">${cyclePct}%</div><div class="lbl">Cycle completion</div></div>
    <div class="stat"><div class="num">${overallAvg?overallAvg.toFixed(1):'—'}</div><div class="lbl">Company average</div></div>
    <div class="stat"><div class="num">${participationPct}%</div><div class="lbl">Feedback participation</div></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Concerns</h3>
    ${concernRows.length===0?'<div class="empty">No concerns right now.</div>':''}
    ${concernRows.map(r=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;">
      <div class="row" style="gap:10px;"><b>${escapeHtml(r.person.name)}</b><span class="small muted">${escapeHtml(r.label)}</span></div>
      <div class="row" style="gap:10px;">${r.score!==null?scoreBadge(r.score):''}<button class="actbtn" data-concern-action="${r.action}" data-person="${r.person.id}" data-dept="${escapeHtml(r.department||'')}">${r.action==='ping'?'Ping':r.action==='reopen'?'Reopen':'Reassign'}</button></div>
    </div>`).join('')}
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Departments</h3>
    <table><thead><tr><th>Department</th><th>Head</th><th>Team score</th><th>Manager score</th><th></th></tr></thead><tbody>
    ${DEPT_SUMMARY_GROUPS.map(g=>{
      const head = deptHeadFor(g);
      const report = deptReportFor(g);
      const entries = deptReportEntries(g, cycle, report);
      const scored = entries.filter(e=>e.score!==null);
      const teamScore = scored.length ? avg(scored.map(e=>e.score)) : null;
      const headRev = head ? findReview('manager', cycle.id, x=>x.employeeId===head.id && x.status==='submitted') : null;
      const managerScore = headRev ? ratingAvgOfReview(headRev) : null;
      return `<tr>

        <td>${head?`<a href="#" data-open-dept-report="${escapeHtml(g)}" style="color:var(--brand);font-weight:600;">${escapeHtml(head.name)}</a>`:'—'}</td>
        <td>${scoreBadge(teamScore)}</td>
        <td>${scoreBadge(managerScore)}</td>
        <td><button class="btn ghost sm" data-open-dept-report="${escapeHtml(g)}">Report →</button></td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">People</h3>
    ${STATE.dashboardPeopleDetailId ? dashboardPersonDetailHtml(STATE.dashboardPeopleDetailId, cycle) : `
      <input type="text" id="dashPeopleSearch" data-autosave-id="dashPeopleSearch" placeholder="Search people..." value="${escapeHtml(STATE.dashboardPeopleSearch||'')}" style="width:100%;margin-bottom:10px;">
      <table><thead><tr><th>Person</th><th>Department</th><th>Manager</th></tr></thead><tbody>
      ${DB.people.filter(p=>!p.deactivated).filter(p=>!STATE.dashboardPeopleSearch || p.name.toLowerCase().includes(STATE.dashboardPeopleSearch.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`
        <tr style="cursor:pointer;" data-open-person-detail="${p.id}">
          <td><div class="person-cell"><div class="avatar">${initials(p.name)}</div>${escapeHtml(p.name)}</div></td>
          <td class="small muted">${escapeHtml(p.department)}</td>
          <td class="small muted">${p.managerId?escapeHtml(getPerson(p.managerId)?getPerson(p.managerId).name:'—'):'—'}</td>
        </tr>`).join('')}
      </tbody></table>
    `}
  </div>

  <div class="grid grid-2">
    <div class="card">
      <h3 style="margin-top:0;">Pending</h3>

async function deleteCycle(cycleId){
  const c = getCycle(cycleId);
  if(!c) return;
  const [selfSnap, mgrSnap, peerSnap, upwardSnap, peerAuthSnap, upwardAuthSnap] = await Promise.all([
    fdb.collection('reviews_self').where('cycleId','==',cycleId).get(),
    fdb.collection('reviews_manager').where('cycleId','==',cycleId).get(),
    fdb.collection('reviews_peer').where('cycleId','==',cycleId).get(),
    fdb.collection('reviews_upward').where('cycleId','==',cycleId).get(),
    fdb.collection('peer_authorship').where('cycleId','==',cycleId).get(),
    fdb.collection('upward_authorship').where('cycleId','==',cycleId).get(),
  ]);
  const [peerCountsSnap, upwardCountsSnap, peerSummariesSnap, upwardSummariesSnap, oneOnOnesSnap, calendarSyncSnap] = await Promise.all([
    fdb.collection('peer_counts').get(),
    fdb.collection('upward_counts').get(),
    fdb.collection('peer_summaries').where('cycleId','==',cycleId).get(),
    fdb.collection('upward_summaries').where('cycleId','==',cycleId).get(),
    fdb.collection('oneonones').where('cycleId','==',cycleId).get(),
    fdb.collection('calendarSync').where('cycleId','==',cycleId).get(),
  ]);
  const peerCountsDocs = peerCountsSnap.docs.filter(d=>d.id.endsWith('_'+cycleId));
  const upwardCountsDocs = upwardCountsSnap.docs.filter(d=>d.id.endsWith('_'+cycleId));

  const total = selfSnap.size + mgrSnap.size + peerSnap.size + upwardSnap.size + peerAuthSnap.size + upwardAuthSnap.size + peerCountsDocs.length + upwardCountsDocs.length + peerSummariesSnap.size + upwardSummariesSnap.size + oneOnOnesSnap.size + calendarSyncSnap.size;
  const warning = total > 0
    ? `This cycle has review data attached: ${selfSnap.size} self-reviews, ${mgrSnap.size} manager reviews, ${peerSnap.size} company wide feedback entries, ${upwardSnap.size} upward reviews, plus related summaries and counters. Deleting "${c.label}" will permanently erase all of it — this cannot be undone.`
    : `"${c.label}" has no review data attached — it's safe to delete.`;
  if(!confirm(`Delete "${c.label}"?\n\n${warning}`)) return;

  const allDocs = [
    ...selfSnap.docs, ...mgrSnap.docs, ...peerSnap.docs, ...upwardSnap.docs,
    ...peerAuthSnap.docs, ...upwardAuthSnap.docs,
    ...peerCountsDocs, ...upwardCountsDocs,
    ...peerSummariesSnap.docs, ...upwardSummariesSnap.docs,
    ...oneOnOnesSnap.docs, ...calendarSyncSnap.docs,
  ];
  for(let i=0; i<allDocs.length; i+=400){
    const batch = fdb.batch();
    allDocs.slice(i, i+400).forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
  await fdb.collection('cycles').doc(cycleId).delete();
  toast('Cycle deleted');
  if(STATE.activeCycleId===cycleId) STATE.activeCycleId = null;
  render();
}
function cycleModal(existingId){
  const c = existingId ? getCycle(existingId) : null;
  const modalHtml = `
  <div class="modal-bg no-print" id="cycleModalBg">
    <div class="modal">
      <span class="close-x" id="closeCycleModal">✕</span>
      <h3>${c?'Edit cycle':'New review cycle'}</h3>
      <div class="field"><label>Year</label><input type="text" id="cy_year" value="${c?c.year:new Date().getFullYear()}"></div>
      <div class="field"><label>Type</label>
        <div class="pill-select">
          <div class="pill ${(!c||c.type==='mid')?'on':''}" data-type="mid">Mid-Year</div>
          <div class="pill ${c&&c.type==='end'?'on':''}" data-type="end">End-of-Year</div>
        </div>
      </div>
      <div class="field"><label>Start date</label><input type="date" id="cy_start" value="${c?c.startDate:''}"></div>
      <div class="field"><label>End date</label><input type="date" id="cy_end" value="${c?c.endDate:''}"></div>
      <button class="btn" id="saveCycleBtn" style="width:100%;">Save cycle</button>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  let selType = c ? c.type : 'mid';
  document.querySelectorAll('#cycleModalBg [data-type]').forEach(el=>el.addEventListener('click', ()=>{
    selType = el.dataset.type;
    document.querySelectorAll('#cycleModalBg [data-type]').forEach(x=>x.classList.toggle('on', x.dataset.type===selType));
  }));
  document.getElementById('closeCycleModal').addEventListener('click', ()=>document.getElementById('cycleModalBg').remove());
  document.getElementById('saveCycleBtn').addEventListener('click', async ()=>{
    const year = document.getElementById('cy_year').value.trim();
    const start = document.getElementById('cy_start').value;
    const end = document.getElementById('cy_end').value;
    if(!year || !start || !end){ alert('Please fill in year, start, and end dates.'); return; }
    const label = year + ' · ' + (selType==='mid'?'Mid-Year':'End-of-Year');
    if(c){ await fdb.collection('cycles').doc(c.id).set({year:+year, type:selType, startDate:start, endDate:end, label}, {merge:true}); }
    else { await fdb.collection('cycles').doc(uid('cyc')).set({year:+year, type:selType, label, startDate:start, endDate:end, status:'draft'}); }
    document.getElementById('cycleModalBg').remove(); toast('Cycle saved'); render();
  });
}

      batch.set(fdb.collection('directory').doc(p.id), directoryFieldsFor(data), {merge:true});
      if(data.managerId !== (p.managerId||null)){
        applyChainRecursive(batch, p.id, computeChainFor(data.managerId));
        // Self-reviews store a snapshot of the manager's email at submission time, so a manager
        // change leaves already-submitted self-reviews invisible to the new manager. Reassign any
        // self-review from a still-open cycle to the new manager so it carries over automatically.
        if(data.managerId){
          const newMgr = getPerson(data.managerId);
          if(newMgr && newMgr.email){
            DB.reviews.self.filter(r=>{
              if(r.employeeEmail!==p.email || r.managerEmail===newMgr.email) return false;
              const c = getCycle(r.cycleId);
              return !c || c.status!=='locked';
            }).forEach(r=>{
              batch.set(fdb.collection('reviews_self').doc(r.id), {managerEmail:newMgr.email}, {merge:true});
            });
          }
        }
      }
      await batch.commit();
    } else {
      const newId = email.split('@')[0].toLowerCase();
      const existing = await fdb.collection('people').doc(newId).get();
      if(existing.exists){ alert('A person with this email already exists.'); return; }
      const fullData = Object.assign({invited:false, active:false, managerChain: computeChainFor(data.managerId)}, data);
      const batch = fdb.batch();
      batch.set(fdb.collection('people').doc(newId), fullData);
      batch.set(fdb.collection('directory').doc(newId), directoryFieldsFor(fullData));
      await batch.commit();
    }
    document.getElementById('personModalBg').remove(); toast(p?'Person updated':'Person added — send them an invite so they can sign in'); render();
  });
}

async function deletePerson(id){
  // Soft-delete only: performance data is sensitive and review history must never be lost,
  // even when someone leaves the org. Deactivating hides them from pickers and department lists but
  // keeps every review, PDF, and audit record intact and queryable by HR.
  if(id===STATE.sessionPersonId){ alert("You can't deactivate your own account while signed in."); return; }
  const p = getPerson(id);
  if(!p) return;
  if(!confirm(`Deactivate ${p.name}? They'll be hidden from pickers and department lists, but all of their review history stays intact and visible to HR. Anyone reporting to them will need a new manager assigned.`)) return;
  const batch = fdb.batch();
  batch.update(fdb.collection('people').doc(id), {deactivated:true, deactivatedAt:new Date().toISOString(), deactivatedBy:sessionPerson().email});
  batch.set(fdb.collection('directory').doc(id), {deactivated:true}, {merge:true});
  DB.people.forEach(x=>{
    if(x.managerId===id){
      batch.update(fdb.collection('people').doc(x.id), {managerId:null});
      applyChainRecursive(batch, x.id, []);
    }
  });
  await batch.commit();
  if(STATE.previewPersonId===id) STATE.previewPersonId=null;
  toast('Person deactivated — review history preserved'); render();
}
async function reactivatePerson(id){
  const batch = fdb.batch();

async function toggleFeedbackVisible(id){

function deptSummariesFor(dept){ return DB.deptSummaries.filter(s=>s.department===dept).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')); }

// Walks managerId pointers up from a person to the root, returning the list of ancestor ids
// (closest manager first, CEO/root last). Used to auto-detect each department's head from the
// real org chart rather than requiring HR to type it in by hand.
function managerChainOf(personId){
  const chain = []; let cur = getPerson(personId); let guard = 0;
  while(cur && cur.managerId && guard < 25){ chain.push(cur.managerId); cur = getPerson(cur.managerId); guard++; }
  return chain;
}
function deptMembers(dept){ return DB.people.filter(p=>p.department===dept && !p.deactivated); }

// Department head = the closest ancestor shared by a clear majority of everyone tagged with that
// department — this correctly finds e.g. Alan Shilling for Marketing (his reports are tagged
// Marketing even though his own tag is Growth) as well as a department's own top person when they
// are tagged with it themselves (e.g. Stephanie Kowalczuk for Magic). We use "majority" rather than
// "everyone" so a single outlier (e.g. someone in the department who happens to report directly to
// a more senior exec instead of the department's day-to-day lead) doesn't drag the detected head all
// the way up to that exec. Among candidates clearing the majority bar, we prefer the one closest to
// the members (smallest average distance) over one that technically covers more people but is more
// senior/generic. The company root (the CEO, who has no manager) is never auto-picked as a head —
// if nothing else clears the majority bar we fall back to the department's own most senior member.
function deptHeadFor(dept){
  const members = deptMembers(dept);
  if(!members.length) return null;
  const total = members.length;
  const candidates = new Map(); // id -> {coveredBy:Set<memberId>, depthSum:number}
  members.forEach(m=>{
    const chain = [m.id, ...managerChainOf(m.id)];
    chain.forEach((ancestorId, depth)=>{
      if(!candidates.has(ancestorId)) candidates.set(ancestorId, {coveredBy:new Set(), depthSum:0});
      const c = candidates.get(ancestorId);
      if(!c.coveredBy.has(m.id)){ c.coveredBy.add(m.id); c.depthSum += depth; }
    });
  });
  let best = null;
  for(const [id, c] of candidates){
    const person = getPerson(id);
    if(!person || !person.managerId) continue; // never auto-pick the company root/CEO
    if(c.coveredBy.size / total <= 0.5) continue; // require a clear majority, not just a plurality
    const avgDepth = c.depthSum / c.coveredBy.size;
    if(!best || avgDepth < best.avgDepth || (avgDepth===best.avgDepth && c.coveredBy.size>best.coverage)){
      best = {id, avgDepth, coverage:c.coveredBy.size};
    }
  }
  if(best) return getPerson(best.id);
  const tagged = members.filter(p=>p.managerId).sort((a,b)=>managerChainOf(a.id).length - managerChainOf(b.id).length);
  return tagged.length ? tagged[0] : members[0];
}

// Performance Review Summaries only ever roll up to the org's 4 VPs (Growth, Product, Engineering,
// Operations) plus Magic — Magic sits under Growth on the reporting line (Stephanie reports to Alan)
// but is carved out as its own summary group since Stephanie runs it independently.
const DEPT_SUMMARY_GROUPS = ['Growth','Product','Engineering','Operations','Magic'];

// Everyone who should show up in a summary group's "Individual flags" table: anyone tagged straight
// to that group (regardless of who they happen to report to day-to-day — e.g. someone in Magic who
// reports directly to Alan still belongs in Magic, not Growth), plus everyone below the group's
// auto-detected head on the real reporting line for sub-teams that aren't tagged with one of our 5
// canonical group names (e.g. Marketing/Partnerships/Ecommerce people report up through Alan and roll
// into Growth; HR/Customer Support/Executive Operations people report up through Liz and roll into
// Operations). People already tagged to one of the other 4 groups are never pulled into this one via
// the reporting-line rollup, and Magic's own subtree is excluded from Growth's rollup either way.
function summaryGroupMembers(group){
  const head = deptHeadFor(group);
  if(!head) return [];
  const magicHead = group!=='Magic' ? deptHeadFor('Magic') : null;
  return DB.people.filter(p=>{
    if(p.deactivated) return false;
    if(p.id===head.id) return true;
    if(p.department===group) return true;
    if(p.department && DEPT_SUMMARY_GROUPS.includes(p.department) && p.department!==group) return false;
    const chain = managerChainOf(p.id);
    if(!chain.includes(head.id)) return false;
    if(magicHead && (p.id===magicHead.id || chain.includes(magicHead.id))) return false;
    return true;
  });
}

/* ============================= TO-DOS (home screen, redesign Aug 2026) ============================= */
// Counts the open/incomplete REQUIRED rows across the To-Dos buckets for the nav badge.
// Kudos (company wide feedback / suggestion box) is optional and never counted, matching the
// prototype's badge behavior. Phase 3 fills in viewTodos() itself with the full row markup;
// this function is the single source of truth both the nav badge and viewTodos rely on.
function computeTodoCount(cycle, person){
  if(!cycle) return 0;
  let n = 0;
  const selfRev = findReview('self', cycle.id, x=>x.employeeId===person.id);
  if(!(selfRev && selfRev.status==='submitted')) n++;
  if(person.managerId){
    const already = DB.upwardAuthorship.find(r=>r.cycleId===cycle.id && r.managerId===person.managerId && r.authorEmail===person.email);
    if(!already) n++;
  }
  if(hasReports(person.id)){
    const reports = directReports(person.id);
    if(reports.length){
      const doneReviews = reports.filter(r=>findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted')).length;
      if(doneReviews < reports.length) n++;
      const pendingOneOnOnes = reports.filter(r=>{
        const mgrRev = findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted');
        if(!mgrRev) return false;
        const o1 = oneOnOneFor(r.id, cycle.id);
        return !o1 || o1.status==='pending';
      }).length;
      if(pendingOneOnOnes) n++;
    }
    const dueFollowUps = (DB.followUps||[]).filter(f=>f.managerId===person.id && f.status!=='done').length;
    n += dueFollowUps;
  }
  const curMonthKey = new Date().toISOString().slice(0,7);
  const myPairing = (DB.coffeeChats||[]).find(c=>c.month===curMonthKey && (c.personA===person.id || c.personB===person.id));
  if(myPairing && !myPairing.calendarEventId) n++;
  return n;
}
function fmtShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function duePillHtml(dateStr){
  if(!dateStr) return '<span class="stpill neutral">No date</span>';
  const today = new Date().toISOString().slice(0,10);
  if(dateStr < today) return '<span class="stpill bad">Overdue</span>';
  return `<span class="stpill warn">Due ${fmtShort(dateStr)}</span>`;
}
// actionAttr is a raw HTML attribute string, e.g. `data-nav="myself"` or `data-log-followup="abc"`,
// so every row's action deep-links to wherever that work actually happens.
function todoRowHtml({done, label, pillHtml, actionLabel, actionAttr, optional}){
  const chk = optional ? '<div class="td-chk"></div>' : `<div class="td-chk${done?' done':''}">${done?'✓':''}</div>`;
  const btn = actionLabel ? `<button class="actbtn" ${actionAttr}>${actionLabel}</button>` : '';
  const right = optional ? btn : `${pillHtml||''}${!done ? btn : ''}`;
  return `<div class="td-row${done?' done':''}">${chk}<span class="td-t">${label}</span><div class="td-right">${right}</div></div>`;
}
function viewTodos(cycle, person){
  const rows1 = [];

  // Self-review: derived from whether the reviews_self doc for this person+cycle is submitted.
  const selfRev = findReview('self', cycle.id, x=>x.employeeId===person.id);
  const selfDone = !!(selfRev && selfRev.status==='submitted');
  rows1.push(todoRowHtml({
    done: selfDone, label: 'Submit your self-review',
    pillHtml: selfDone ? '<span class="stpill ok">Submitted</span>' : duePillHtml(cycle.endDate),
    actionLabel: 'Write', actionAttr: 'data-nav="myself"'
  }));

  // Review your manager: derived from a reviews_upward submission (upward_authorship) this cycle.
  if(person.managerId){
    const alreadyUpward = DB.upwardAuthorship.find(r=>r.cycleId===cycle.id && r.managerId===person.managerId && r.authorEmail===person.email);
    const upwardDone = !!alreadyUpward;
    rows1.push(todoRowHtml({
      done: upwardDone, label: 'Review your manager (anonymous)',
      pillHtml: upwardDone ? '<span class="stpill ok">Submitted</span>' : duePillHtml(cycle.endDate),
      actionLabel: 'Start', actionAttr: 'data-nav="upwardform"'
    }));
  }

  const isManager = hasReports(person.id);
  let reports = [];
  if(isManager){
    reports = directReports(person.id);
    // Write manager reviews: count of submitted reviews_manager docs vs total direct reports.
    const doneReviews = reports.filter(r=>findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted')).length;
    const remaining = reports.length - doneReviews;
    rows1.push(todoRowHtml({
      done: remaining===0,
      label: `Write manager reviews · ${remaining} of ${reports.length} remaining`,
      pillHtml: remaining===0 ? '<span class="stpill ok">Completed</span>' : duePillHtml(cycle.endDate),
      actionLabel: 'Continue', actionAttr: 'data-nav="myteam"'
    }));

    // Schedule 1:1 debriefs: derived from oneonones records for reports whose review is submitted.
    const pendingOneOnOnes = reports.filter(r=>{
      const mgrRev = findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted');
      if(!mgrRev) return false;
      const o1 = oneOnOneFor(r.id, cycle.id);
      return !o1 || o1.status==='pending';
    }).length;
    rows1.push(todoRowHtml({
      done: pendingOneOnOnes===0,
      label: `Schedule 1:1 debriefs · ${pendingOneOnOnes} remaining`,
      pillHtml: pendingOneOnOnes===0 ? '<span class="stpill ok">Completed</span>' : '<span class="stpill warn">This week</span>',
      actionLabel: 'Book', actionAttr: 'data-nav="myteam"'
    }));
  }
  // Note: an admin "quality actions" row (reopen a review flagged below quality standard) is
  // intentionally omitted here. The current schema has no field that flags a submitted review
  // as below a quality bar (deptSummaries.pipStatus flags a *person*, not a review), so there is
  // no real data to derive this row from. Flagged for phase 6 if HR wants this concept added.

  const buckets = [];
  buckets.push({header: cycle.label.toUpperCase(), hint: `due ${fmtShort(cycle.endDate)}`, rowsHtml: rows1.join('')});

  // Follow-ups due (managers only): year-round commitments registry (PIP checkpoints, monitor
  // check-ins, workload reviews). Genuinely new in this redesign — the followUps collection
  // starts empty, so this bucket is honestly empty until someone logs a commitment.
  if(isManager){
    const myFollowUps = (DB.followUps||[]).filter(f=>f.managerId===person.id && f.status!=='done')
      .sort((a,b)=>(a.checkpointDate||'').localeCompare(b.checkpointDate||''));
    const followUpRows = myFollowUps.map(f=>{
      const who = getPerson(f.personId);
      return todoRowHtml({
        done:false,
        label: `${escapeHtml(f.commitment||'Check-in')} · ${who?escapeHtml(who.name):'—'}`,
        pillHtml: duePillHtml(f.checkpointDate),
        actionLabel: 'Log', actionAttr: `data-log-followup="${f.id}"`
      });
    });
    buckets.push({
      header: 'Follow-ups due', hint: '',
      rowsHtml: followUpRows.length ? followUpRows.join('') : '<div class="empty">Nothing due right now.</div>'
    });
  }

  // Coffee chat (monthly cross-department pairing). Pairing generation is a manual admin
  // action and out of scope for this phase — if this person has no pairing yet for the current
  // month, this shows a neutral empty state rather than a fabricated entry.
  const monthKey = new Date().toISOString().slice(0,7);
  const myPairing = (DB.coffeeChats||[]).find(c=>c.month===monthKey && (c.personA===person.id || c.personB===person.id));
  let coffeeRowHtml;
  if(!myPairing){
    coffeeRowHtml = '<div class="empty">No pairing yet this month.</div>';
  } else {
    const partnerId = myPairing.personA===person.id ? myPairing.personB : myPairing.personA;
    const partner = getPerson(partnerId);
    const monthLabel = new Date(monthKey+'-01T00:00:00').toLocaleDateString('en-US',{month:'long'});
    const scheduled = !!myPairing.calendarEventId;
    coffeeRowHtml = todoRowHtml({
      done: scheduled,
      label: `${monthLabel} pairing · ${partner?escapeHtml(partner.name):'—'}`,
      pillHtml: scheduled ? '<span class="stpill ok">Scheduled</span>' : '<span class="stpill warn">This month</span>',
      actionLabel: 'Schedule', actionAttr: `data-schedule-coffee="${myPairing.id}"`
    });
  }
  buckets.push({header: 'Coffee chat', hint: 'monthly', rowsHtml: coffeeRowHtml});

  // Kudos: optional, no pills, no derived completion — just entry points.
  const kudosRows = [
    todoRowHtml({optional:true, label:'Give anonymous feedback about a colleague', actionLabel:'Start', actionAttr:'data-nav="peerform"'}),
    todoRowHtml({optional:true, label:'Drop a suggestion in the box', actionLabel:'Start', actionAttr:'data-nav="suggestform"'}),
  ].join('');
  buckets.push({header:'Kudos', hint:'', rowsHtml: kudosRows});

  return `<div class="h1" style="font-family:var(--font-head);font-weight:600;font-size:22px;margin-bottom:14px;">Your to-dos</div>
  ${buckets.map(b=>`<div class="card">
    <h3 class="section-h">${escapeHtml(b.header)}${b.hint?`<span class="hint">${escapeHtml(b.hint)}</span>`:''}</h3>
    ${b.rowsHtml}
  </div>`).join('')}`;
}

function viewManagerReports(cycle, person){
  const managers = managersList().slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(managers.length===0) return `<div class="card"><h2>Manager reports</h2><div class="empty">No managers yet.</div></div>`;
  if(!STATE.mreportsManagerId || !managers.find(mg=>mg.id===STATE.mreportsManagerId)) STATE.mreportsManagerId = managers[0].id;
  const m = getPerson(STATE.mreportsManagerId);

  const upwardList = DB.reviews.upward.filter(r=>r.cycleId===cycle.id && r.managerId===m.id);
  const upwardScore = avg(upwardList.map(ratingAvgOfReview).filter(Boolean));
  const upwardResponseCount = upwardList.length;

  const reports = directReports(m.id);
  const givenScores = reports.map(r=>{ const rev=findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted'); return rev?ratingAvgOfReview(rev):null; }).filter(v=>v!==null);
  const givenAvg = givenScores.length ? avg(givenScores) : null;
  const companyAvg = avg(DB.reviews.manager.filter(r=>r.cycleId===cycle.id).map(ratingAvgOfReview).filter(Boolean));

  const reviewsDone = reports.filter(r=>findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted')).length;
  const oneOnOnesDone = reports.filter(r=>{ const o=oneOnOneFor(r.id, cycle.id); return o && o.status==='completed'; }).length;
  const dutiesTotal = reports.length*2;
  const dutiesDone = reviewsDone + oneOnOnesDone;
  const dutiesPct = dutiesTotal ? Math.round(dutiesDone/dutiesTotal*100) : 0;

  // No quality-flagging mechanism exists anywhere in this app for manager reviews (checked —
  // nothing tags a review as low-quality or incomplete beyond submitted/not). Showing 0 honestly
  // rather than inventing a flag source.
  const qualityFlags = 0;

  const teamSaysVisible = upwardVisible(m.id, cycle.id);
  const upwardSummary = upwardSummaryFor(m.id, cycle.id);
  let teamSaysText;
  if(!teamSaysVisible) teamSaysText = `Fewer than ${ANONYMITY_MIN} upward responses this cycle — themes withheld to protect anonymity.`;
  else if(upwardSummary && upwardSummary.themes) teamSaysText = upwardSummary.themes;
  else teamSaysText = "HR hasn't written a themes summary for this manager yet — see Upward reviews.";

  let calibrationText;
  if(givenAvg===null || companyAvg===null){
    calibrationText = 'Not enough submitted manager reviews yet to compare.';
  } else {
    const delta = givenAvg - companyAvg;
    const dir = Math.abs(delta)<0.05 ? 'in line with' : (delta>0 ? 'above' : 'below');
    calibrationText = `${m.name} rates their reports ${givenAvg.toFixed(1)} on average this cycle, ${dir} the company average of ${companyAvg.toFixed(1)}${Math.abs(delta)>=0.05?' by '+Math.abs(delta).toFixed(1):''}.`;
  }

  const myFollowUps = (DB.followUps||[]).filter(f=>f.managerId===m.id);
  const followUpsDone = myFollowUps.filter(f=>f.status==='done').length;
  const followUpText = myFollowUps.length===0
    ? 'No follow-up commitments logged for this manager.'
    : `${followUpsDone}/${myFollowUps.length} follow-up commitments completed, ${myFollowUps.length-followUpsDone} still open.`;

  const noteDoc = (DB.managerReports||[]).find(x=>x.id===m.id) || {recommendation:''};

  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h2 style="margin:0;">Manager reports</h2>
      <select id="mreportsSelect">${managers.map(mg=>`<option value="${mg.id}" ${mg.id===m.id?'selected':''}>${escapeHtml(mg.name)} · ${escapeHtml(mg.department)}</option>`).join('')}</select>
    </div>
    <div class="desc">Internal to admin — never shown to the manager and never published. ${escapeHtml(cycle.label)}.</div>
  </div>

  <div class="grid grid-4">
    <div class="stat"><div class="num">${scoreBadge(upwardScore)}</div><div class="lbl">Upward feedback · ${upwardResponseCount} responses</div></div>
    <div class="stat"><div class="num">${givenAvg!==null?givenAvg.toFixed(1):'—'}</div><div class="lbl">Avg score given (co. avg ${companyAvg!==null?companyAvg.toFixed(1):'—'})</div></div>
    <div class="stat"><div class="num">${dutiesPct}%</div><div class="lbl">Cycle duties completed</div></div>
    <div class="stat ${qualityFlags>0?'bad':''}"><div class="num">${qualityFlags}</div><div class="lbl">Quality flags</div></div>
  </div>

  <div class="card">
    <div class="block"><b>What their team says</b><p>${escapeHtml(teamSaysText)}</p></div>
    <div class="block"><b>How they review</b><p>${escapeHtml(calibrationText)}</p></div>
    <div class="block"><b>Follow-up discipline</b><p>${escapeHtml(followUpText)}</p></div>
    <div class="field" style="margin-top:4px;margin-bottom:2px;"><label>Recommendation</label>
      <textarea data-autosave-id="mrRec_${m.id}" data-mgr-recommendation="${m.id}" rows="4" placeholder="Internal notes and recommendation for ${escapeHtml(m.name)} — never published.">${escapeHtml(noteDoc.recommendation||'')}</textarea>
    </div>
    <div class="small muted" data-save-status-for="mrRec_${m.id}">&nbsp;</div>
  </div>`;
}

// Resolves which of the 5 canonical summary groups (DEPT_SUMMARY_GROUPS) a person belongs to,
// by real org-chart membership — reuses summaryGroupMembers/deptHeadFor rather than trusting
// person.department directly, since sub-teams (e.g. Marketing) roll up into a different group.
function deptGroupFor(personId){
  for(const g of DEPT_SUMMARY_GROUPS){
    if((deptHeadFor(g)||{}).id===personId) return g;
    if(summaryGroupMembers(g).some(p=>p.id===personId)) return g;
  }
  return null;
}

function deptReportIdFor(dept){ return 'dept_' + dept.replace(/[^a-zA-Z0-9]+/g, '_'); }

  return DB.deptSummaries.find(s=>s.id===id) || {id, department:dept, status:'draft', summary:'', people:{}};
}

// Everything a Department Report shows about one person, computed live from real review data for
// the active cycle. Nothing here is stored except the admin-set status and recommendation — the
// rest (self-review words, manager's assessment, 1:1 outcome, score) always reflects the current
// state of their review, so the report can never go stale or say something that isn't backed by
// an actual submitted review.
function deptReportEntryFor(person, cycle, report){
  const selfRev = findReview('self', cycle.id, x=>x.employeeId===person.id);
  const mgrRev = findReview('manager', cycle.id, x=>x.employeeId===person.id);
  const selfDone = !!(selfRev && selfRev.status==='submitted');
  const mgrDone = !!(mgrRev && mgrRev.status==='submitted');
  const score = mgrDone ? ratingAvgOfReview(mgrRev) : null;
  const admin = (report.people && report.people[person.id]) || {};
  const status = admin.status || 'no';
  const recommendation = admin.recommendation || '';
  const inTheirWords = selfDone
    ? [selfRev.answers.accomplishments, selfRev.answers.growthAreas, selfRev.answers.openFeedback].filter(Boolean).join('\n\n')
    : '';
  const managersAssessment = mgrDone
    ? [mgrRev.answers.keyWins, mgrRev.answers.growthOpportunities, mgrRev.answers.managerNotes].filter(Boolean).join('\n\n')
    : '';
  const o1 = oneOnOneFor(person.id, cycle.id);
  let oneOnOneOutcome;
  if(!mgrDone) oneOnOneOutcome = 'Manager review not submitted yet.';
  else if(!o1 || o1.status==='pending') oneOnOneOutcome = 'Not scheduled yet.';
  else if(o1.status==='scheduled') oneOnOneOutcome = 'Scheduled for ' + fmtDateTime(o1.scheduledAt) + '.';
  else oneOnOneOutcome = 'Completed ' + fmtDate((o1.completedAt||'').slice(0,10)) + '.';
  // "Notable" (gets a full card instead of the one-line card) — an admin-set status, a low score,
  // or an already-drafted recommendation. Status is never auto-assigned from the score; a low
  // score only makes the card notable enough to review, same as the Dashboard's concern count.
  const notable = status!=='no' || (score!==null && score<3.5) || !!recommendation.trim();
  const reviewerOfRecord = person.managerId ? (getPerson(person.managerId)?getPerson(person.managerId).name:'—') : '—';
  return { person, reviewerOfRecord, selfDone, mgrDone, score, status, recommendation, inTheirWords, managersAssessment, oneOnOneOutcome, notable };
}
function deptReportEntries(dept, cycle, report){
  const head = deptHeadFor(dept);
  return summaryGroupMembers(dept)
    .filter(p=>!head || p.id!==head.id)
    .sort((a,b)=>a.name.localeCompare(b.name))
    .map(p=>deptReportEntryFor(p, cycle, report));
}

function viewPeerHR(cycle){

  // would silently disappear from this summary even though HR still needs to see their counts.
  const coverageRows = DB.people.filter(p=>!p.deactivated || p.visibleInFeedback || byTarget[p.id]).map(p=>{
    const count = peerCountFor(p.id, cycle.id);

function ratingRowHtml(field, current){
  const val = current||0;
  return `<div class="rating-row" data-rating-field="${field.key}">
    <div class="rlabel">${field.label}</div>
    <div class="stars">${[1,2,3,4,5].map(n=>`<div class="star ${n<=val?'on':''}" data-star="${n}">${n}</div>`).join('')}</div>
    <div class="small muted" data-rating-text style="width:150px;">${val?RATING_LABELS[val]:'Not rated'}</div>
  </div>`;
}
function ratingLegendHTML(){
  return `<div class="small muted" style="margin-bottom:10px;">1 needs improvement · 2 developing · 3 meets expectations · 4 exceeds · 5 exceptional</div>`;
}
function bindRatingRow(container, field, onChange){
  const row = container.querySelector(`[data-rating-field="${field.key}"]`);
  if(!row) return;
  row.querySelectorAll('.star').forEach(starEl=>{
    starEl.addEventListener('click', ()=>{
      const val = +starEl.dataset.star;
      row.querySelectorAll('.star').forEach(s=>s.classList.toggle('on', +s.dataset.star<=val));
      row.querySelector('[data-rating-text]').textContent = RATING_LABELS[val];
      onChange(val);
    });
  });
}

/* ============================= MANAGER: MY TEAM ============================= */
function viewMyTeam(cycle, person){
  const reports = directReports(person.id);

  // Reviews written: same predicate used in viewTodos' "Write manager reviews" row.
  const doneReviews = reports.filter(r=>findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted')).length;

  // 1:1s booked: booked means an oneonones record exists and isn't still 'pending', same
  // predicate viewTodos uses to compute pendingOneOnOnes (just inverted).
  const oneOnOnesBooked = reports.filter(r=>{
    const o1 = oneOnOneFor(r.id, cycle.id);
    return o1 && o1.status!=='pending';
  }).length;

  // Overdue follow-ups: checkpoint date in the past and not yet resolved. Same followUps
  // collection viewTodos' "Follow-ups due" bucket reads, scoped to this manager.
  const today = new Date().toISOString().slice(0,10);
  const myFollowUps = (DB.followUps||[]).filter(f=>f.managerId===person.id)
    .sort((a,b)=>(a.checkpointDate||'').localeCompare(b.checkpointDate||''));
  const overdueFollowUps = myFollowUps.filter(f=>f.status!=='done' && f.checkpointDate && f.checkpointDate<today).length;

  // Manager's own self-review submission date: same lookup viewTodos uses for "Submit your self-review".
  const mySelfRev = findReview('self', cycle.id, x=>x.employeeId===person.id);
  const mySelfSubmitted = !!(mySelfRev && mySelfRev.status==='submitted');
  const selfDateDisplay = mySelfSubmitted ? fmtDate(mySelfRev.submittedAt.slice(0,10)) : 'Not submitted';

  // Review queue: one row per report, collapsed to a single derived status + single next step,
  // reusing the same submitted/self-review/1:1 predicates as viewTodos and viewSelfForm rather
  // than the old per-pipeline-stage columns (self-review / manager review / feedback / upward /
  // 1:1, each with its own pill).
  const queueRows = reports.map(r=>{
    const selfRev = findReview('self', cycle.id, x=>x.employeeId===r.id);
    const selfSubmitted = !!(selfRev && selfRev.status==='submitted');
    const mgrRev = findReview('manager', cycle.id, x=>x.employeeId===r.id && x.status==='submitted');
    const mgrDone = !!mgrRev;
    const o1 = oneOnOneFor(r.id, cycle.id);
    let step, pillCls, pillLabel, actionLabel, actionAttr, blocked;
    if(!mgrDone){
      step = 'Write your review · ' + (selfSubmitted ? 'self-review ready to reference' : 'self-review still pending');
      pillCls = 'bad'; pillLabel = 'Pending';
      actionLabel = 'Write review'; actionAttr = `data-fill-manager="${r.id}"`;
      blocked = true;
    } else if(!o1 || o1.status==='pending'){
      step = 'Schedule the 1:1 debrief · review submitted';
      pillCls = 'warn'; pillLabel = 'Action needed';
      actionLabel = 'Schedule'; actionAttr = `data-schedule-oneonone="${r.id}"`;
      blocked = true;
    } else if(o1.status==='scheduled'){
      step = 'Confirm the 1:1 happened · scheduled ' + fmtDateTime(o1.scheduledAt);
      pillCls = 'warn'; pillLabel = 'Scheduled';
      actionLabel = 'Mark done'; actionAttr = `data-complete-oneonone="${o1.id}"`;
      blocked = true;
    } else {
      step = 'All caught up · 1:1 completed ' + fmtDate((o1.completedAt||'').slice(0,10));
      pillCls = 'ok'; pillLabel = 'Done';
      actionLabel = 'View review'; actionAttr = `data-fill-manager="${r.id}"`;
      blocked = false;
    }
    return {person:r, step, pillCls, pillLabel, actionLabel, actionAttr, blocked};
  }).sort((a,b)=>{
    if(a.blocked!==b.blocked) return a.blocked ? -1 : 1;
    return a.person.name.localeCompare(b.person.name);
  });

  return `
  <div class="h1" style="font-family:var(--font-head);font-weight:600;font-size:22px;margin-bottom:14px;">Team home</div>

  <div class="grid grid-4">
    <div class="stat"><div class="num">${doneReviews}/${reports.length}</div><div class="lbl">Reviews written</div></div>
    <div class="stat"><div class="num">${oneOnOnesBooked}/${reports.length}</div><div class="lbl">1:1s booked</div></div>
    <div class="stat ${overdueFollowUps>0?'warn':''}"><div class="num">${overdueFollowUps}</div><div class="lbl">Overdue follow-ups</div></div>
    <div class="stat"><div class="num" style="font-size:16px;">${selfDateDisplay}</div><div class="lbl">Your self-review submitted</div></div>
  </div>

  <div class="card">
    <h2>Review queue</h2>
    <div class="desc">${escapeHtml(cycle.label)}. Blockers first, one next step per person.</div>
    ${reports.length===0 ? '<div class="empty">No direct reports.</div>' : `
    <table>
      <thead><tr><th>Person</th><th>Next step</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${queueRows.map(q=>`<tr>
          <td><div class="person-cell"><div class="avatar">${initials(q.person.name)}</div>${escapeHtml(q.person.name)}</div></td>
          <td class="small">${escapeHtml(q.step)}</td>
          <td><span class="stpill ${q.pillCls}">${q.pillLabel}</span></td>
          <td><button class="actbtn" ${q.actionAttr}>${q.actionLabel}</button></td>
        </tr>`).join('')}
      </tbody>
    </table>`}
  </div>

  <div id="managerFormHost"></div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <div><h2>Follow-ups & commitments</h2><div class="desc">Year-round registry (PIP check-ins, monitor checkpoints, workload reviews) for your direct reports. Due items also surface in To-Dos.</div></div>
      <button class="btn ghost sm" id="addFollowUpBtn">+ Add</button>
    </div>
    ${myFollowUps.length===0 ? '<div class="empty">No commitments logged yet. Use + Add to log one.</div>' : `
    <table>
      <thead><tr><th>Person</th><th>Commitment</th><th>Checkpoint date</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${myFollowUps.map(f=>{
          const who = getPerson(f.personId);
          const isDone = f.status==='done';
          const isOverdue = !isDone && f.checkpointDate && f.checkpointDate<today;
          const pill = isDone ? '<span class="stpill ok">Done</span>' : (isOverdue ? '<span class="stpill bad">Overdue</span>' : '<span class="stpill warn">Open</span>');
          return `<tr>
            <td><div class="person-cell"><div class="avatar">${initials(who?who.name:'—')}</div>${who?escapeHtml(who.name):'—'}</div></td>
            <td class="small">${escapeHtml(f.commitment||'—')}</td>
            <td class="small muted">${fmtDate(f.checkpointDate)}</td>
            <td>${pill}</td>
            <td>${isDone?'':`<button class="actbtn" data-log-followup="${f.id}">Log</button>`}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  </div>`;
}
